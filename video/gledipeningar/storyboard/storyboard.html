<!doctype html><html lang="is"><head><meta charset="utf-8"><style>
@font-face{font-family:Figtree;font-weight:500;src:url(../public/fonts/figtree-latin-500-normal.woff2)}
@font-face{font-family:Figtree;font-weight:700;src:url(../public/fonts/figtree-latin-700-normal.woff2)}
@font-face{font-family:Figtree;font-weight:800;src:url(../public/fonts/figtree-latin-800-normal.woff2)}
*{box-sizing:border-box}body{margin:0;background:#F0EBF7;font-family:Figtree;color:#18003E;width:2400px;padding:72px 72px 80px}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:44px}
h1{font-weight:800;font-size:64px;letter-spacing:-.04em;margin:0}
.sub{font-weight:500;font-size:24px;color:rgba(24,0,62,.6);margin-top:10px}
.spec{font-weight:700;font-size:20px;letter-spacing:.12em;text-transform:uppercase;color:#691FE7;text-align:right;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:36px 28px}
figure{margin:0}img{width:100%;display:block;border-radius:14px;box-shadow:0 10px 30px rgba(42,10,94,.12)}
figcaption{padding:16px 4px 0}.meta{display:flex;gap:12px;align-items:baseline}
.n{font-weight:800;font-size:22px;color:#691FE7}.name{font-weight:800;font-size:24px;letter-spacing:-.01em;flex:1}.tc{font-weight:700;font-size:20px;color:rgba(24,0,62,.5)}
.txt{font-weight:600;font-size:20px;margin-top:8px;line-height:1.3}.snd{font-weight:500;font-size:18px;margin-top:6px;color:rgba(24,0,62,.55)}
</style></head><body>
<header><div><h1>Takk krónur: storyboard</h1><div class="sub">Hreyfigrafík, 90 sek. Fyrri hluti útskýrir Takk krónur, seinni hlutinn yfirfærir hugmyndina á veitingastaði og bari.</div></div>
<div class="spec">1920 × 1080 · 60 fps · 120 BPM<br>Figtree · Takk fjólublár #691FE7</div></header>
<div class="grid">
  <figure>
    <img src="frames/01.jpg">
    <figcaption>
      <div class="meta"><span class="n">01</span><span class="name">Peningurinn</span><span class="tc">0:02</span></div>
      <div class="txt">Takk krónur</div>
      <div class="snd">Klingur, peningur snýst niður</div>
    </figcaption>
  </figure>
  <figure>
    <img src="frames/02.jpg">
    <figcaption>
      <div class="meta"><span class="n">02</span><span class="name">65.000</span><span class="tc">0:07</span></div>
      <div class="txt">65.000 manns safna Takk krónum</div>
      <div class="snd">Smellir í bylgju, hljómur á 65.000</div>
    </figcaption>
  </figure>
  <figure>
    <img src="frames/03.jpg">
    <figcaption>
      <div class="meta"><span class="n">03</span><span class="name">Svona virkar það</span><span class="tc">0:10</span></div>
      <div class="txt">Þú verslar. Hluti verðsins kemur til baka.</div>
      <div class="snd">Píp á posa, peningar í símann</div>
    </figcaption>
  </figure>
  <figure>
    <img src="frames/04.jpg">
    <figcaption>
      <div class="meta"><span class="n">04</span><span class="name">Ekki afsláttur</span><span class="tc">0:17</span></div>
      <div class="txt">Ekki afsláttur í dag. Krónur fyrir næstu ferð.</div>
      <div class="snd">Miði sveiflast og snýst</div>
    </figcaption>
  </figure>
  <figure>
    <img src="frames/05.jpg">
    <figcaption>
      <div class="meta"><span class="n">05</span><span class="name">Þunn álagning</span><span class="tc">0:21</span></div>
      <div class="txt">Matvara: þunn álagning, lítið til baka</div>
      <div class="snd">Dynkur, strik dregið</div>
    </figcaption>
  </figure>
  <figure>
    <img src="frames/06.jpg">
    <figcaption>
      <div class="meta"><span class="n">06</span><span class="name">Hagkaup</span><span class="tc">0:28</span></div>
      <div class="txt">Föst söfnun í Hagkaup, 1,5% til 15%</div>
      <div class="snd">Smellur á hverja súlu, ris í 15%</div>
    </figcaption>
  </figure>
  <figure>
    <img src="frames/07.jpg">
    <figcaption>
      <div class="meta"><span class="n">07</span><span class="name">Refurinn</span><span class="tc">0:32</span></div>
      <div class="txt">Refurinn, 15%</div>
      <div class="snd">Högg og bjalla</div>
    </figcaption>
  </figure>
  <figure>
    <img src="frames/08.jpg">
    <figcaption>
      <div class="meta"><span class="n">08</span><span class="name">Af hverju</span><span class="tc">0:40</span></div>
      <div class="txt">Ástæða til að koma aftur. Krónurnar virka bara þar.</div>
      <div class="snd">Fótatak, hringur</div>
    </figcaption>
  </figure>
  <figure>
    <img src="frames/09.jpg">
    <figcaption>
      <div class="meta"><span class="n">09</span><span class="name">Vendipunktur</span><span class="tc">0:45</span></div>
      <div class="txt">Hvað ef veitingastaðir gerðu það sama?</div>
      <div class="snd">Trommur detta út, ris</div>
    </figcaption>
  </figure>
  <figure>
    <img src="frames/10.jpg">
    <figcaption>
      <div class="meta"><span class="n">10</span><span class="name">Tilboð</span><span class="tc">0:49</span></div>
      <div class="txt">Gesturinn sparar. Og fer.</div>
      <div class="snd">Fjórir skellir á slaginu</div>
    </figcaption>
  </figure>
  <figure>
    <img src="frames/11.jpg">
    <figcaption>
      <div class="meta"><span class="n">11</span><span class="name">Reikningurinn</span><span class="tc">0:57</span></div>
      <div class="txt">1.500 kr. og 1 heimsókn á móti 4.500 kr. og 2 heimsóknum</div>
      <div class="snd">Kassi, peningar, teljari</div>
    </figcaption>
  </figure>
  <figure>
    <img src="frames/12.jpg">
    <figcaption>
      <div class="meta"><span class="n">12</span><span class="name">Föstudagskvöld</span><span class="tc">1:05</span></div>
      <div class="txt">40.000 kr. á barnum</div>
      <div class="snd">Glös klingja, síaður bassi</div>
    </figcaption>
  </figure>
  <figure>
    <img src="frames/13.jpg">
    <figcaption>
      <div class="meta"><span class="n">13</span><span class="name">Laugardagsmorgunn</span><span class="tc">1:08</span></div>
      <div class="txt">+8.000 tkr</div>
      <div class="snd">Titringur, tilkynning</div>
    </figcaption>
  </figure>
  <figure>
    <img src="frames/14.jpg">
    <figcaption>
      <div class="meta"><span class="n">14</span><span class="name">Markmiðið</span><span class="tc">1:18</span></div>
      <div class="txt">Flöskuborð í boði hússins</div>
      <div class="snd">Leikjahljóð, opnun</div>
    </figcaption>
  </figure>
  <figure>
    <img src="frames/15.jpg">
    <figcaption>
      <div class="meta"><span class="n">15</span><span class="name">Kostnaðurinn</span><span class="tc">1:21</span></div>
      <div class="txt">Þú borgar innkaupsverðið. Engin kortagjöld.</div>
      <div class="snd">Miði snýst, högg</div>
    </figcaption>
  </figure>
  <figure>
    <img src="frames/16.jpg">
    <figcaption>
      <div class="meta"><span class="n">16</span><span class="name">Lokaspjald</span><span class="tc">1:29</span></div>
      <div class="txt">Næst á matseðlinum: veitingastaðir.</div>
      <div class="snd">Lokahljómur</div>
    </figcaption>
  </figure></div></body></html>
