<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<title>Einkaréttur í Foreldrabók</title>
<style>
@font-face{font-family:PJS;font-weight:600;src:url(node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:PJS;font-weight:700;src:url(node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:PJS;font-weight:800;src:url(node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-800-normal.woff2) format('woff2')}
:root{--c1:#f6f2fd;--c2:#ddd2f1;--ink:#1c1035;--violet:#6b3df5;--sub:#4b3d6e;--gold:#e8a10f}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;font-family:PJS,sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink)}
#bg{position:absolute;inset:0;background:radial-gradient(110% 120% at 62% 42%,var(--c1) 0%,var(--c1) 22%,var(--c2) 100%)}
#gl{position:absolute;inset:0}
#ui{position:absolute;inset:0;overflow:hidden}
.tx{position:absolute;will-change:transform,opacity}
.w{display:inline-block;white-space:nowrap}
.c{display:inline}
.tx.words .w{display:inline-block}
.eyebrow{font-weight:800;font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:var(--violet)}
.h1{font-weight:800;font-size:96px;line-height:1.03;letter-spacing:-.035em}
.h2{font-weight:800;font-size:64px;line-height:1.08;letter-spacing:-.03em}
.h3{font-weight:800;font-size:46px;line-height:1.12;letter-spacing:-.02em}
em{font-style:normal;color:var(--violet)}
em.gold{color:var(--gold)}
.sub{font-weight:600;font-size:36px;line-height:1.34;color:var(--sub);letter-spacing:-.01em}
.sub b{font-weight:800;color:var(--ink)}
.xl{font-weight:800;font-size:150px;line-height:1;letter-spacing:-.045em;color:var(--violet)}
.xl.gold{color:var(--gold)}
.pill{display:inline-block;background:var(--violet);color:#fff;font-weight:700;font-size:26px;padding:10px 24px;border-radius:999px;letter-spacing:-.005em}
.pill.gold{background:#ffc23c;color:var(--ink)}
.pill.ink{background:var(--ink)}
.pill.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 3px var(--ink)}
.chapter{position:absolute;inset:0;display:none}
.cin{position:absolute;left:150px;top:390px}
.ch-title{font-weight:800;font-size:132px;line-height:1.02;letter-spacing:-.04em;margin-top:14px}
.ch-num{position:absolute;right:120px;top:60px;font-weight:800;font-size:820px;line-height:.82;letter-spacing:-.06em}
.pin{position:absolute;left:0;top:0;transform-origin:50% 100%;white-space:nowrap;display:none}
.pin.below{transform-origin:50% 0%}
.chip{background:#fff;color:var(--ink);font-weight:800;font-size:28px;padding:10px 20px;border-radius:999px;box-shadow:0 10px 30px rgba(60,30,120,.16)}
.chip.sm{font-size:22px;padding:8px 16px}
.chip.gold{background:#ffc23c}
.chip.violet{background:var(--violet);color:#fff}
.chip.gray{background:#ece8f3;color:#8a80a3}
.chip.strike{background:#ffe1e5;color:#d7324a;text-decoration:line-through;text-decoration-thickness:3px}
.label{background:rgba(255,255,255,.92);color:var(--ink);font-weight:800;font-size:22px;padding:8px 16px;border-radius:14px;box-shadow:0 8px 24px rgba(60,30,120,.14)}
.badge{width:52px;height:52px;border-radius:50%;color:#fff;font-weight:800;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(60,30,120,.2);border:3px solid #fff}
.cap{text-align:center;white-space:normal;width:440px}
.cap-t{font-weight:800;font-size:34px;letter-spacing:-.02em;line-height:1.1}
.cap-s{font-weight:600;font-size:25px;color:var(--sub);margin-top:8px;line-height:1.3}
.num-dot{width:58px;height:58px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;font-size:30px;display:flex;align-items:center;justify-content:center}
.barrow{position:absolute;display:none}
.br-label{font-weight:700;font-size:30px;color:var(--sub);margin-bottom:10px}
.br-track{height:40px;border-radius:20px;background:rgba(107,61,245,.1);overflow:hidden;width:100%}
.br-fill{height:100%;border-radius:20px;width:5%}
.br-val{position:absolute;right:0;top:-6px;font-weight:800;font-size:44px;letter-spacing:-.02em}
.scrim.strong{background:linear-gradient(90deg,rgba(246,242,253,1) 0%,rgba(246,242,253,.97) 42%,rgba(246,242,253,0) 60%)}
.scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(246,242,253,.97) 0%,rgba(246,242,253,.9) 30%,rgba(246,242,253,0) 52%);display:none}
.track{position:absolute;height:22px;border-radius:11px;background:rgba(28,16,53,.08)}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:11px;background:var(--violet)}
.track .dot{position:absolute;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:#fff;box-shadow:0 0 0 7px var(--violet),0 10px 24px rgba(60,30,120,.25)}
.track .tick{position:absolute;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(28,16,53,.25)}
.rule{display:flex;align-items:center;gap:24px;background:rgba(255,255,255,.75);border-radius:26px;padding:22px 30px;box-shadow:0 12px 34px rgba(60,30,120,.1);font-weight:600;font-size:31px;line-height:1.3;color:var(--sub);width:880px}
.rule b{font-weight:800;color:var(--ink)}
.rule .num-dot{flex:none}
.months{position:absolute;display:flex;gap:0}
.month{display:flex;flex-direction:column;align-items:center;width:200px;font-weight:800;font-size:24px;color:var(--sub)}
.month .md{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 4px rgba(28,16,53,.18);margin-bottom:12px}
.month.on .md{background:var(--violet);box-shadow:none}
.mline{position:absolute;height:6px;border-radius:3px;background:rgba(28,16,53,.12);top:19px;left:100px;width:400px;overflow:hidden}
.mline i{position:absolute;left:0;top:0;bottom:0;background:var(--violet);width:0}
.store{display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:6px 18px 6px 6px;font-weight:800;font-size:22px;color:var(--ink);box-shadow:0 8px 24px rgba(60,30,120,.16)}
.store i{width:34px;height:34px;border-radius:50%;color:#fff;font-style:normal;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
.daylbl{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;font-size:22px;padding:6px 14px;border-radius:12px;white-space:nowrap}
.cat{background:#fff;color:var(--ink);font-weight:800;font-size:40px;letter-spacing:-.02em;padding:10px 28px;border-radius:20px;box-shadow:0 12px 34px rgba(60,30,120,.16)}
.cat.sm{font-size:28px;padding:8px 20px;border-radius:16px}
.dealchip{background:#ff5f9e;color:#fff;font-weight:800;font-size:24px;padding:8px 16px;border-radius:14px;box-shadow:0 10px 26px rgba(255,95,158,.35);transform:rotate(-4deg)}
.dealchip.v{background:var(--violet);box-shadow:0 10px 26px rgba(107,61,245,.3)}
.dealchip.g{background:#ffc23c;color:var(--ink);box-shadow:0 10px 26px rgba(232,161,15,.3)}
.dealchip.m{background:#20bf85;box-shadow:0 10px 26px rgba(32,191,133,.3)}
.fade{position:absolute;inset:0;background:var(--c1);opacity:0;pointer-events:none}
</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head>
<body>
<div id="bg"></div>
<div id="gl"></div>
<div id="ui"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
