<!doctype html>
<html><head><meta charset="utf-8"><title>film</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Inter:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{--ink:#2a2420;--cream:#f6f5ec}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#2e2a24}
#stage{position:absolute;inset:0;background:radial-gradient(120% 95% at 32% 12%, #6a6052 0%, #4a4438 46%, #2e2a24 100%)}
#beam{position:absolute;inset:0;background:linear-gradient(118deg, transparent 30%, rgba(255,236,206,.13) 43%, rgba(255,236,206,.09) 53%, transparent 66%);pointer-events:none}
#grain{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.045) .6px, transparent .7px);background-size:3px 3px;mix-blend-mode:overlay;pointer-events:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#storyWrap{position:absolute;inset:0;opacity:0}
#storyWrap .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 95% at 50% 55%, transparent 60%, rgba(46,42,36,.12) 100%), linear-gradient(to bottom, rgba(239,231,218,.92) 0%, rgba(239,231,218,.7) 22%, transparent 34%)}
#labels{position:absolute;inset:0;pointer-events:none}
.lead{position:absolute;left:0;top:0;width:1.5px;background:rgba(42,36,32,.45);transform-origin:50% 100%}
.cap{position:absolute;left:0;top:0;padding-bottom:12px;font:500 14px/1 Inter;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
#heroWrap{position:absolute;inset:0;opacity:0}
#frame{position:absolute;inset:30px;border:1px solid rgba(246,245,236,.16);pointer-events:none}
#captions{position:absolute;inset:0;pointer-events:none}
.c{position:absolute}
.c.left{left:9vw;top:50%;transform:translateY(-50%);max-width:46vw}
.c.top{left:6vw;right:6vw;top:6.2vh;text-align:center;display:flex;flex-direction:column;align-items:center}
.c.end{left:0;right:0;top:57%;text-align:center;display:flex;flex-direction:column;align-items:center}
.c.end .eb i{display:none}
.eb{display:flex;align-items:center;gap:20px;font:500 15px/1 Inter;letter-spacing:.26em;text-transform:uppercase}
.eb i{display:block;width:56px;height:1px;transform-origin:0 50%}
.c.top .eb i{display:none}
.ln{display:block;overflow:hidden;padding-top:.18em;margin-top:-.18em;padding-bottom:.08em}
.ln>span{display:block;will-change:transform}
.ttl{margin-top:30px;font-family:Jost;font-weight:300;text-transform:uppercase;letter-spacing:.07em;font-size:52px;line-height:1.14}
.c.top .ttl{margin-top:22px;font-size:50px;line-height:1.16}
.ttl em{font-family:"Instrument Serif";font-style:italic;text-transform:none;letter-spacing:0}
.ttl em.acci{font-size:1.28em;line-height:1}
.ttl .whole em.acc{font-size:1.62em;line-height:1.02}
.sub{margin-top:26px;font:400 22px/1.55 Inter;max-width:820px}
.c.top .sub{margin-top:16px;font-size:20px}
.note{margin-top:14px;font:500 12px/1 Inter;letter-spacing:.22em;text-transform:uppercase;opacity:.6}
.dark{color:var(--cream)} .dark .eb{color:rgba(246,245,236,.72)} .dark .eb i{background:rgba(246,245,236,.55)} .dark .sub{color:rgba(246,245,236,.74)}
.light{color:var(--ink)} .light .eb{color:rgba(42,36,32,.62)} .light .eb i{background:rgba(42,36,32,.42)} .light .sub{color:rgba(42,36,32,.74)}
.num{opacity:.5;margin-left:.4em}
#logo{position:absolute;left:50%;top:40%;width:230px;transform:translate(-50%,-50%);opacity:0}
#g{position:absolute;right:10px;bottom:8px;font:11px Inter;color:#aaa}
</style></head>
<body>
<div id="stage"></div><div id="beam"></div>
<div id="heroWrap"><canvas id="hero"></canvas></div>
<div id="storyWrap"><canvas id="story"></canvas><div id="labels"></div><div class="vig"></div></div>
<div id="grain"></div>
<div id="frame"></div>
<img id="logo" src="/svif/logo-cream.png" alt="">
<div id="captions"></div>
<div id="g"></div>
<script type="module" src="./film.ts"></script>
</body></html>
