<!doctype html><html><head><meta charset="utf-8"><title>vignette</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Inter:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
html,body{margin:0;height:100%;background:#4a4438;overflow:hidden}
#panel{position:absolute;left:0;top:0;background:#efe7da;overflow:hidden}
#panel.round{border-radius:24px}
canvas{display:block;width:100%;height:100%}
#ov{position:absolute;inset:0;pointer-events:none}
#ov svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cap{position:absolute;left:0;top:0;font:500 10.5px/1 Inter;letter-spacing:.2em;text-transform:uppercase;color:rgba(42,36,32,.78);white-space:nowrap}
.fig{position:absolute;left:7%;top:6.5%;color:#2a2420}
.fig b{display:block;font:300 clamp(40px,10.5%,80px)/1 Jost;letter-spacing:.02em}
.fig i{display:block;font:500 10.5px/1 Inter;letter-spacing:.22em;font-style:normal;margin-top:10px;color:rgba(42,36,32,.7)}
#info{position:absolute;right:8px;bottom:6px;font:11px Inter;color:#f6f5ec;opacity:.6}
</style></head><body><div id="panel"><canvas id="c"></canvas><div id="ov"><svg id="lines"></svg></div></div><div id="info"></div>
<script type="module" src="./vignette.ts"></script></body></html>
