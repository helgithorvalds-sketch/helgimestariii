<!doctype html>
<html><head><meta charset="utf-8"><title>hero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&family=Inter:wght@400;500&family=Instrument+Serif:ital@1&display=swap">
<style>
html,body{margin:0;height:100%;}
body{background:radial-gradient(120% 90% at 30% 10%, #6e6455 0%, #4a4438 45%, #2e2a24 100%);overflow:hidden;font-family:Inter,sans-serif}
.beam{position:absolute;inset:0;background:linear-gradient(118deg, transparent 30%, rgba(255,236,206,.20) 44%, rgba(255,236,206,.15) 52%, transparent 66%);pointer-events:none}
.grain{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) .6px, transparent .7px);background-size:3px 3px;pointer-events:none;mix-blend-mode:overlay}
canvas{position:absolute;inset:0;width:100vw;height:100vh;display:block}
.copy{position:absolute;left:7vw;top:50%;transform:translateY(-50%);color:#f6f5ec;max-width:40vw}
.eyebrow{font:500 11px Inter;letter-spacing:.24em;text-transform:uppercase;color:rgba(246,245,236,.7);display:flex;gap:14px;align-items:center}
.eyebrow:before{content:"";width:40px;height:1px;background:rgba(246,245,236,.5)}
h1{font-family:Jost;font-weight:300;text-transform:uppercase;letter-spacing:.08em;font-size:clamp(28px,2.7vw,46px);line-height:1.12;margin:28px 0 0}
h1 em{display:block;font-family:"Instrument Serif";font-style:italic;text-transform:none;letter-spacing:0;font-size:1.7em;line-height:1}
.frame{position:absolute;inset:22px;border:1px solid rgba(246,245,236,.18);pointer-events:none}
</style></head><body><div class="beam"></div><canvas id="c"></canvas><div class="grain"></div><div class="frame"></div>
<div class="copy"><div class="eyebrow">SVIF · Nýji kaflinn</div><h1>Við tengjum ykkur við<em>alla nýja húseigendur</em>á höfuðborgarsvæðinu.</h1></div>
<script type="module" src="./hero.ts"></script></body></html>
