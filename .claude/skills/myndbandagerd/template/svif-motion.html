<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&family=Unbounded:wght@700..900&display=swap">
<style>
/* Layout: one fixed 16:9 stage (1920×1080 logical px) scaled to fit, with a slim transport bar beneath.
   Single deliberate look: white clay city, one electric blue, the SVIF book's line-drawn cover. */
:root {
  --paper: #eceff4;      /* world background / fog */
  --ink: #0d1530;        /* deep navy text */
  --ink-soft: #4a5470;   /* secondary text */
  --signal: #1f55ff;     /* SVIF blue */
  --roof: #8ea2ea;       /* the light blue roof from the book cover */
  --frame: #dde1e9;      /* page around the stage */
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --logo: "Unbounded", "Arial Black", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--frame); color: var(--ink); font-family: var(--body); overflow: hidden; }
#app { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding-inline: 16px; box-sizing: border-box; }
#viewport { position: relative; width: 100%; max-width: 100%; flex: 0 0 auto; overflow: hidden; border-radius: 14px; box-shadow: 0 30px 80px -30px rgba(13,21,48,.35), 0 0 0 1px rgba(13,21,48,.06); background: var(--paper); }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: var(--paper); }
#gl { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
.vignette { position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 55% at 12% 100%, rgba(236,239,244,.92), rgba(236,239,244,0) 70%),
    radial-gradient(ellipse 120% 90% at 50% 50%, rgba(13,21,48,0) 60%, rgba(13,21,48,.10) 100%); }
.grain { position: absolute; inset: 0; pointer-events: none; opacity: .05; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

.logo { font-family: var(--logo); font-weight: 900; letter-spacing: .01em; color: var(--ink); display: inline-flex; align-items: flex-end; line-height: 1; }
.logo .i { position: relative; display: inline-block; }
.logo .i svg { position: absolute; left: 50%; bottom: 76%; transform: translateX(-50%); width: .62em; height: .25em; overflow: visible; }

.brand { position: absolute; left: 110px; top: 84px; display: flex; align-items: center; gap: 20px; }
.brand .logo { font-size: 38px; }
.brand .tag { font-size: 20px; font-weight: 500; color: var(--ink-soft); letter-spacing: .02em; padding-left: 20px; border-left: 1.5px solid rgba(13,21,48,.18); }

.chapters { position: absolute; right: 110px; top: 92px; display: flex; flex-direction: column; align-items: flex-end; gap: 14px; }
.chapters .bars { display: flex; gap: 8px; }
.chapters .bar { width: 46px; height: 4px; border-radius: 2px; background: rgba(13,21,48,.12); overflow: hidden; }
.chapters .bar i { display: block; height: 100%; width: 0; background: var(--signal); }
.chapters .name { font-size: 19px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.chapters .name b { color: var(--signal); font-weight: 700; margin-right: 12px; }

.cap { position: absolute; left: 110px; bottom: 104px; width: 1080px; opacity: 0; }
.cap .eb { display: flex; align-items: center; gap: 14px; font-size: 21px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--signal); margin-bottom: 22px; }
.cap .eb::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 6px rgba(31,85,255,.15); }
.cap .ti { margin: 0; font-family: var(--display); font-weight: 700; font-size: 84px; line-height: 1.0; letter-spacing: -.028em; color: var(--ink); text-wrap: balance; font-variation-settings: "opsz" 96; }
.cap .su { margin: 26px 0 0; font-size: 30px; line-height: 1.35; color: var(--ink-soft); font-weight: 500; max-width: 900px; }
.w { display: inline-block; white-space: pre; will-change: transform, opacity, filter; }

#pins { position: absolute; inset: 0; pointer-events: none; }
.pill { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 12px; padding: 14px 24px 14px 18px; border-radius: 999px; background: rgba(255,255,255,.96); color: var(--ink); font-size: 26px; font-weight: 600; white-space: nowrap; box-shadow: 0 14px 34px -10px rgba(13,30,80,.28), 0 0 0 1px rgba(13,21,48,.06); opacity: 0; }
.pill i { width: 12px; height: 12px; border-radius: 50%; background: var(--signal); opacity: .8; }
.node-tag { position: absolute; left: 0; top: 0; padding: 18px 26px; border-radius: 18px; background: rgba(255,255,255,.95); box-shadow: 0 18px 40px -14px rgba(13,30,80,.3), 0 0 0 1px rgba(13,21,48,.06); opacity: 0; white-space: nowrap; }
.node-tag small { display: block; font-size: 17px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--signal); }
.node-tag strong { display: block; font-family: var(--display); font-size: 46px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 6px; }
.node-tag span { font-size: 20px; color: var(--ink-soft); font-weight: 500; }

.count { position: absolute; right: 110px; top: 170px; text-align: right; opacity: 0; }
.count strong { display: block; font-family: var(--display); font-weight: 750; font-size: 110px; letter-spacing: -.04em; line-height: 1; color: var(--signal); font-variant-numeric: tabular-nums; }
.count span { display: block; margin-top: 10px; font-size: 26px; font-weight: 600; color: var(--ink); }
.count em { font-style: normal; color: var(--ink-soft); font-weight: 500; }

.end { position: absolute; left: 110px; bottom: 110px; opacity: 0; }
.end .logo { font-size: 200px; }
.end .line { margin-top: 44px; font-family: var(--display); font-weight: 600; font-size: 58px; letter-spacing: -.02em; color: var(--ink); }
.end .web { margin-top: 26px; display: inline-flex; align-items: center; gap: 16px; font-size: 34px; font-weight: 700; color: var(--signal); letter-spacing: .01em; }
.end .web::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 7px rgba(31,85,255,.15); }

#loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; color: var(--ink-soft); background: var(--paper); letter-spacing: .1em; text-transform: uppercase; font-weight: 600; }

#controls { display: flex; align-items: center; gap: 14px; width: 100%; max-width: 100%; box-sizing: border-box; }
#controls button { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; cursor: pointer; display: grid; place-items: center; }
#controls button.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px rgba(13,21,48,.25); }
#controls button:focus-visible, #scrub:focus-visible { outline: 3px solid var(--signal); outline-offset: 3px; }
#controls svg { width: 18px; height: 18px; fill: currentColor; }
#scrub { flex: 1 1 auto; min-width: 0; accent-color: var(--signal); }
#time { flex: 0 0 auto; font-size: 14px; font-weight: 600; color: var(--ink-soft); font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
.capture #app { padding: 0; gap: 0; }
.capture #viewport { border-radius: 0; box-shadow: none; }
.capture #controls { display: none; }
</style>

<div id="app">
  <div id="viewport">
    <div id="stage">
      <canvas id="gl" width="1920" height="1080"></canvas>
      <div class="vignette"></div>

      <header class="brand" id="brand">
        <span class="logo">SV<span class="i">I<svg viewBox="0 0 40 16" aria-hidden="true"><path d="M3 14 L20 3 L37 14" fill="none" stroke="#8ea2ea" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>F</span>
        <span class="tag">Fyrir nýja húseigendur</span>

      <div class="end" id="end">
        <div class="logo">SV<span class="i">I<svg viewBox="0 0 40 16" aria-hidden="true"><path d="M3 14 L20 3 L37 14" fill="none" stroke="#8ea2ea" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>F</div>
        <div class="line">Rétta fólkið, á réttu augnabliki.</div>
        <div class="web">svif.is</div>

      <div id="loading">Hleð inn borginni…</div>
    </div>
  </div>
  <div id="controls">
    <button id="play" type="button" aria-label="Spila eða gera hlé"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4.5v15l13-7.5z"/></svg></button>
    <button id="mute" type="button" class="ghost" aria-label="Hljóð af eða á"><svg viewBox="0 0 24 24" id="muteIcon"><path d="M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M4 9h4l5-4v14l-5-4H4z"/></svg></button>

    <div id="time">0:00 / 1:10</div>
  </div>
  <audio id="music" src="music.mp3" preload="auto"></audio>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const W = 1920, H = 1080, DUR = 70;
const CAPTURE = location.hash.includes('capture');
if (CAPTURE) document.documentElement.classList.add('capture');

/* ---------- helpers ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rand = mulberry32(20261013);
const R = (a,b)=>a+(b-a)*rand();
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eout=t=>1-Math.pow(1-t,3);
const esine=t=>-(Math.cos(Math.PI*t)-1)/2;
const eback=t=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const env=(t,a,b,fi=.6,fo=.6)=>Math.min(eio(prog(t,a,a+fi)),1-eio(prog(t,b-fo,b)));
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const BLUE = new THREE.Color('#1f55ff');

/* ---------- renderer ---------- */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: CAPTURE, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;

const scene = new THREE.Scene();
const BG = new THREE.Color('#eceff4');
scene.background = BG;
scene.fog = new THREE.Fog(BG, 240, 680);
const camera = new THREE.PerspectiveCamera(32, W/H, 0.5, 1400);

scene.add(new THREE.HemisphereLight('#ffffff', '#bcc5d6', 1.35));
const sun = new THREE.DirectionalLight('#fffdf8', 3.05);
sun.position.set(-80, 140, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -110, right: 110, top: 110, bottom: -110, near: 20, far: 360 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.05; sun.shadow.radius = 2.2;
scene.add(sun, sun.target);

/* ---------- textures ---------- */
function canvasTex(w,h,draw,{repeat=false,srgb=true}={}){
  const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); draw(g,w,h);
  const t=new THREE.CanvasTexture(c); if(srgb) t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8;
  if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;} return t;
}
const texGroove = canvasTex(128,128,(g)=>{g.fillStyle='#ffffff';g.fillRect(0,0,128,128);g.fillStyle='#dfe4ec';g.fillRect(0,0,7,128);},{repeat:true});
const texGrid = canvasTex(128,128,(g)=>{g.fillStyle='#ffffff';g.fillRect(0,0,128,128);g.fillStyle='#e2e6ee';g.fillRect(22,28,84,64);g.fillStyle='#f3f5f9';g.fillRect(22,28,84,8);},{repeat:true});
const texGlow = canvasTex(256,256,(g)=>{const r=g.createRadialGradient(128,128,0,128,128,128);r.addColorStop(0,'rgba(31,85,255,.42)');r.addColorStop(.45,'rgba(31,85,255,.14)');r.addColorStop(1,'rgba(31,85,255,0)');g.fillStyle=r;g.fillRect(0,0,256,256);});
const texBlob = canvasTex(128,128,(g)=>{const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(20,30,60,.32)');r.addColorStop(1,'rgba(20,30,60,0)');g.fillStyle=r;g.fillRect(0,0,128,128);});
const texMarker = canvasTex(160,160,(g)=>{
  g.shadowColor='rgba(13,30,80,.35)'; g.shadowBlur=18; g.shadowOffsetY=6;
  g.fillStyle='#fff'; g.beginPath(); g.arc(80,74,46,0,Math.PI*2); g.fill();
  g.shadowColor='transparent'; g.fillStyle='#1f55ff'; g.beginPath(); g.arc(80,74,25,0,Math.PI*2); g.fill();
});

/* ---------- materials ---------- */
const M = {
  ground: new THREE.MeshStandardMaterial({ color:'#e3e7ee', roughness:1 }),
  block:  new THREE.MeshStandardMaterial({ color:'#f7f8fb', roughness:.95 }),
  white:  new THREE.MeshStandardMaterial({ color:'#ffffff', roughness:.88 }),
  groove: new THREE.MeshStandardMaterial({ color:'#ffffff', roughness:.88, map:texGroove }),
  grid:   new THREE.MeshStandardMaterial({ color:'#ffffff', roughness:.88, map:texGrid }),
  detail: new THREE.MeshStandardMaterial({ color:'#e6eaf1', roughness:.9 }),
  base:   new THREE.MeshStandardMaterial({ color:'#eaeef5', roughness:.6 }),
  path:   new THREE.MeshStandardMaterial({ color:'#eceff5', roughness:1 }),
  dash:   new THREE.MeshStandardMaterial({ color:'#fafbfc', roughness:1 }),
  tree:   new THREE.MeshStandardMaterial({ color:'#ffffff', roughness:1 }),
  trunk:  new THREE.MeshStandardMaterial({ color:'#eef1f5', roughness:1 }),
  blue:   new THREE.MeshStandardMaterial({ color:'#1f55ff', roughness:.55 }),
  blueSoft: new THREE.MeshStandardMaterial({ color:'#8fa9ff', roughness:.7 }),
  dark:   new THREE.MeshStandardMaterial({ color:'#3a4256', roughness:.6 }),
  box:    new THREE.MeshStandardMaterial({ color:'#efe6d8', roughness:.9 }),
  pages:  new THREE.MeshStandardMaterial({ color:'#f4f5f8', roughness:.8 }),
};

/* ---------- city layout ---------- */
const PITCH=26, BLK=20, ROADS=[-91,-65,-39,-13,13,39,65,91];
const HERO = { x:52, z:26 };
const buildings=[]; const trees=[]; const risers=[];
const city = new THREE.Group(); scene.add(city);

const slab = new THREE.Mesh(new RoundedBoxGeometry(192, 8, 192, 2, 1.2), M.ground);
slab.position.y = -4; slab.receiveShadow = true; city.add(slab);

function uvBox(geo,w,h,d,u=3){
  const uv=geo.attributes.uv; const dims=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for(let f=0;f<6;f++) for(let k=0;k<4;k++){const i=f*4+k; uv.setXY(i,uv.getX(i)*dims[f][0]/u,uv.getY(i)*dims[f][1]/u);} return geo;
}
const rd = mulberry32(5150);          // details only: keeps the layout RNG untouched
const RD = (a,b)=>a+(b-a)*rd();
const edgeMat = new THREE.LineBasicMaterial({ color:'#c4cbd9', transparent:true, opacity:.75 });
function outline(geo, grp, angle=20){ const l=new THREE.LineSegments(new THREE.EdgesGeometry(geo, angle), edgeMat); grp.add(l); return l; }
function detailMesh(parts, grp, mat=M.white){ if(!parts.length) return; const m=new THREE.Mesh(mergeGeometries(parts), mat); m.castShadow=m.receiveShadow=true; grp.add(m); outline(m.geometry, grp, 30); }
function addRiser(obj, x, z, extra=0){
  const d=Math.hypot(x+20,z+20); obj.userData.delay = .15 + d/150*2.4 + rand()*.35 + extra; risers.push(obj);
}
function tower(gx,gz,w,d,h,kind){
  const grp=new THREE.Group(); grp.position.set(gx,.4,gz);
  const geo=uvBox(new THREE.BoxGeometry(w,h,d),w,h,d, kind==='grid'?2.6:2.2).translate(0,h/2,0);
  const side = kind==='grid'?M.grid:kind==='groove'?M.groove:M.white;
  const m=new THREE.Mesh(geo,[side,side,M.white,M.white,side,side]); m.castShadow=m.receiveShadow=true; grp.add(m);
  outline(geo, grp);
  const parts=[];
  parts.push(new THREE.BoxGeometry(w+.32,.34,d+.32).translate(0,h+.02,0));                        // cornice
  if(h>5){ const base=new THREE.Mesh(new THREE.BoxGeometry(w+.08,1.1,d+.08).translate(0,.55,0),M.base); base.receiveShadow=true; grp.add(base); }
  if(kind==='grid' && h<15 && h>5){                                                               // balconies on the long faces
    const alongX = w>=d, len = alongX?w:d, depth = alongX?d:w;
    for(let y=2.6; y<h-1.2; y+=2.6) for(let x=-len/2+1.6; x<=len/2-1.6; x+=3.2) for(const sd of [-1,1]){
      const g=alongX? new THREE.BoxGeometry(1.7,.14,.75).translate(x,y,sd*(depth/2+.37)) : new THREE.BoxGeometry(.75,.14,1.7).translate(sd*(depth/2+.37),y,x);
      parts.push(g);
      const rail=alongX? new THREE.BoxGeometry(1.7,.42,.05).translate(x,y+.28,sd*(depth/2+.73)) : new THREE.BoxGeometry(.05,.42,1.7).translate(sd*(depth/2+.73),y+.28,x);
      parts.push(rail);
    }
  }
  if(h>14 && rd()<.6){ parts.push(new THREE.BoxGeometry(.18,RD(2.5,4.5),.18).translate(RD(-w/3,w/3),h+2,RD(-d/3,d/3))); }  // antenna
  detailMesh(parts, grp);
  if(rand()<.7){ const uw=R(1.4,2.6), ud=R(1.2,2.2); const u=new THREE.Mesh(new THREE.BoxGeometry(uw,.9,ud).translate(0,.45,0),M.detail); u.position.set(R(-w/4,w/4),h,R(-d/4,d/4)); u.castShadow=true; grp.add(u); }
  city.add(grp); addRiser(grp,gx,gz); return grp;
}
function cylTower(gx,gz,r,h){
  const grp=new THREE.Group(); grp.position.set(gx,.4,gz);
  const geo=new THREE.CylinderGeometry(r,r,h,56,1).translate(0,h/2,0);
  const uv=geo.attributes.uv; for(let i=0;i<57*2;i++) uv.setXY(i,uv.getX(i)*2*Math.PI*r/2.2,uv.getY(i)*h/2.2);
  const m=new THREE.Mesh(geo,[M.groove,M.white,M.white]); m.castShadow=m.receiveShadow=true; grp.add(m);
  outline(geo, grp, 12);
  detailMesh([new THREE.CylinderGeometry(r+.18,r+.18,.34,56).translate(0,h+.02,0), new THREE.CylinderGeometry(r*.55,r*.55,1.2,32).translate(0,h+.6,0)], grp);
  const base=new THREE.Mesh(new THREE.CylinderGeometry(r+.05,r+.05,1.1,56).translate(0,.55,0),M.base); grp.add(base);
  city.add(grp); addRiser(grp,gx,gz); return grp;
}
function house(gx,gz,rot,hero=false){
  const grp=new THREE.Group(); grp.position.set(gx,.4,gz); grp.rotation.y=rot;
  const s = hero?1.12:1;
  const w=3.8*s,d=4.4*s,wh=2.5*s,rh=1.7*s;
  const body=new THREE.Mesh(new THREE.BoxGeometry(d,wh,w).translate(0,wh/2,0),M.white); body.castShadow=body.receiveShadow=true; grp.add(body);
  const sh=new THREE.Shape(); sh.moveTo(-w/2-.25,0); sh.lineTo(w/2+.25,0); sh.lineTo(0,rh); sh.closePath();
  const rg=new THREE.ExtrudeGeometry(sh,{depth:d+.4,bevelEnabled:false}); rg.translate(0,0,-(d+.4)/2); rg.rotateY(Math.PI/2);
  const roof=new THREE.Mesh(rg,M.white); roof.position.y=wh; roof.castShadow=roof.receiveShadow=true; grp.add(roof);
  outline(body.geometry, grp); const rl=outline(rg, grp); rl.position.y=wh;
  const plinth=new THREE.Mesh(new THREE.BoxGeometry(d+.14,.3,w+.14).translate(0,.15,0),M.base); grp.add(plinth);

  updateOverlay(t);
}

/* ---------- sound cues: exact times of what happens on screen ---------- */
function soundEvents(){
  const ev=[];
  ev.push({k:'selt',t:7.45});
  taskEls.forEach((k,i)=>{ ev.push({k:'pill',t:k.at+.08,i}); ev.push({k:'absorb',t:k.fly+.9,i}); });
  ev.push({k:'bookIn',t:TL.bookIn+.2},{k:'open',t:TL.open1+.15},{k:'offer',t:TL.glowA+.25},{k:'offer',t:TL.glowB+.25},{k:'close',t:TL.close1+.1},{k:'rise',t:TL.rise},{k:'node',t:TL.nodeIn});
  detPings.forEach(p=>ev.push({k:'found',t:p.act}));
  delivered.forEach(b=>ev.push({k:'drop',t:b.delT+1.25}));
  ev.push({k:'vanStart',t:TL.vanA},{k:'bookUp',t:TL.bookUp},{k:'open',t:TL.open2+.15});
  for(let i=0;i<8;i++) ev.push({k:'tile',t:TL.tiles+i*TL.tileStep+.1,i});
  ev.push({k:'back',t:TL.back},{k:'end',t:TL.end+.1});
  finPings.forEach(p=>ev.push({k:'fin',t:p.act}));
  return {dur:DUR, tl:TL, events:ev.sort((a,b)=>a.t-b.t)};
}
window.__events = soundEvents;

/* ---------- boot ---------- */
async function init(){
  try { await Promise.race([Promise.all([document.fonts.load(`900 100px ${FONT_L}`),document.fonts.load(`750 100px ${FONT_D}`),document.fonts.load(`700 100px ${FONT_D}`),document.fonts.load(`600 40px ${FONT_B}`),document.fonts.load(`500 40px ${FONT_B}`),document.fonts.load(`700 40px ${FONT_B}`)]), new Promise(r=>setTimeout(r,4000))]); } catch(e){}
  paintPages(); buildBook();
  signGrp.userData.board.material = new THREE.MeshBasicMaterial({side:THREE.DoubleSide,toneMapped:false,map:canvasTex(512,320,(g,w,h)=>{g.fillStyle='#1f55ff';g.fillRect(0,0,w,h);g.fillStyle='#fff';g.font=`800 150px ${FONT_D}`;g.textAlign='center';g.textBaseline='middle';g.fillText('SELT',w/2,h/2+8);})});
  const miniGeo=new THREE.BoxGeometry(.85,1.0,.1); const miniMat=[M.pages,M.pages,M.pages,M.pages,new THREE.MeshBasicMaterial({map:pageTex.cover,toneMapped:false}),M.pages];
  delivered.forEach(b=>{ const t0=timeForU(b.ru)-.25; b.delT=t0; const vp=route.getPointAt(clamp(vanU(t0),0,.999)); const from=vp.clone().add(V(0,2.2,0)); const dir=V(vp.x-b.x,0,vp.z-b.z).normalize(); const to=V(b.x,1.4,b.z).addScaledVector(dir,Math.min(b.w,b.d)/2+.2); const m=new THREE.Mesh(miniGeo,miniMat); m.visible=false; scene.add(m); minis.push({m,t0,from,to}); });
  document.getElementById('loading').hidden=true;
}

/* ---------- playback ---------- */
const viewport=document.getElementById('viewport'), stage=document.getElementById('stage');
const scrub=document.getElementById('scrub'), timeEl=document.getElementById('time'), playBtn=document.getElementById('play'), playIcon=document.getElementById('playIcon');
const music=document.getElementById('music'), muteBtn=document.getElementById('mute');
let playing=false, T=0, last=0, muted=false;
const ICON_PLAY='<path d="M7 4.5v15l13-7.5z"/>', ICON_PAUSE='<path d="M6 4.5h4v15H6zM14 4.5h4v15h-4z"/>';
const mmss=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
scrub.max=DUR; timeEl.textContent=`0:00 / ${mmss(DUR)}`;
function layout(){
  if(CAPTURE){ viewport.style.width=W+'px'; viewport.style.height=H+'px'; stage.style.transform='none'; renderer.setPixelRatio(1.5); renderer.setSize(W,H,false); return; }  // 1.5× supersampling for crisp edges
  const avW=document.getElementById('app').clientWidth-32, avH=window.innerHeight-80;
  const s=Math.min(avW/W, avH/H); viewport.style.width=(W*s)+'px'; viewport.style.height=(H*s)+'px'; stage.style.transform=`scale(${s})`;
  const q=clamp(s*(window.devicePixelRatio||1),.5,1); renderer.setSize(Math.round(W*q),Math.round(H*q),false);
  document.getElementById('controls').style.width=(W*s)+'px';
}
function syncAudio(){ try{ if(Math.abs(music.currentTime-T)>.25) music.currentTime=T; }catch(e){} }
function setPlaying(p){ playing=p; playIcon.innerHTML=p?ICON_PAUSE:ICON_PLAY; last=performance.now();
  if(p&&!muted){ syncAudio(); music.play().catch(()=>{}); } else music.pause(); }
function tick(now){ if(playing){ T+=Math.min(.1,(now-last)/1000); last=now; if(T>=DUR){T=DUR; setPlaying(false);} render(T); scrub.value=T; timeEl.textContent=`${mmss(T)} / ${mmss(DUR)}`; } requestAnimationFrame(tick); }
playBtn.addEventListener('click',()=>{ if(T>=DUR) T=0; setPlaying(!playing); });
muteBtn.addEventListener('click',()=>{ muted=!muted; muteBtn.style.opacity=muted?.45:1; if(muted) music.pause(); else if(playing){ syncAudio(); music.play().catch(()=>{}); } });
scrub.addEventListener('input',()=>{ T=parseFloat(scrub.value); render(T); syncAudio(); timeEl.textContent=`${mmss(T)} / ${mmss(DUR)}`; });
window.addEventListener('resize',()=>{ layout(); render(T); });
window.addEventListener('keydown',e=>{ if(e.code==='Space'&&e.target===document.body){ e.preventDefault(); playBtn.click(); } });

window.__ready = (async()=>{ layout(); await init(); render(0);
  if(CAPTURE) return true;
  T=0; render(T); requestAnimationFrame(tick); return true; })();
window.__seek = (t)=>{ render(t); return true; };
</script>
