<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Straumlind – sama rafmagn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400..900&display=swap">
<style>
/* One fixed 16:9 stage (1920×1080) scaled to fit, slim transport bar beneath.
   Look: white clay models on an endless white plane, every scene built up from nothing.
   Accents come from the Straumlind bolt: cyan for electricity and data, orange for Straumlind itself. */
:root {
  --paper: #eef1f3;
  --ink: #0b3446;        /* deep version of the wordmark navy #00506e */
  --ink-soft: #4f6873;
  --signal: #00a7bd;     /* cyan from the bolt, a touch deeper for text */
  --signal-rgb: 0,167,189;
  --hot: #ff7800;        /* orange from the bolt */
  --frame: #dfe4e7;
  --font: "Montserrat", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--frame); color: var(--ink); font-family: var(--font); overflow: hidden; }
#app { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding-inline: 16px; box-sizing: border-box; }
#viewport { position: relative; width: 100%; flex: 0 0 auto; overflow: hidden; border-radius: 14px; box-shadow: 0 30px 80px -30px rgba(11,52,70,.35), 0 0 0 1px rgba(11,52,70,.06); background: var(--paper); }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: var(--paper); }
#gl { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
.vignette { position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 62% 58% at 8% 100%, rgba(238,241,243,.95), rgba(238,241,243,0) 72%),
    radial-gradient(ellipse 120% 90% at 50% 50%, rgba(11,52,70,0) 62%, rgba(11,52,70,.08) 100%); }
.grain { position: absolute; inset: 0; pointer-events: none; opacity: .045; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }

.brand { position: absolute; left: 110px; top: 84px; display: flex; align-items: center; gap: 22px; }
.brand svg { height: 30px; width: auto; display: block; }
.brand .tag { font-size: 19px; font-weight: 600; color: var(--ink-soft); letter-spacing: .02em; padding-left: 22px; border-left: 1.5px solid rgba(11,52,70,.18); }

.chapters { position: absolute; right: 110px; top: 90px; display: flex; flex-direction: column; align-items: flex-end; gap: 14px; }
.chapters .bars { display: flex; gap: 8px; }
.chapters .bar { width: 46px; height: 4px; border-radius: 2px; background: rgba(11,52,70,.12); overflow: hidden; }
.chapters .bar i { display: block; height: 100%; width: 0; background: var(--signal); }
.chapters .name { font-size: 18px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); }
.chapters .name b { color: var(--signal); font-weight: 800; margin-right: 12px; }

.cap { position: absolute; left: 110px; bottom: 100px; width: 1060px; opacity: 0; }
.cap .eb { display: flex; align-items: center; gap: 14px; font-size: 20px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--signal); margin-bottom: 22px; }
.cap .eb::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 6px rgba(var(--signal-rgb),.16); }
.cap .ti { margin: 0; font-weight: 800; font-size: 76px; line-height: 1.04; letter-spacing: -.035em; color: var(--ink); text-wrap: balance; }
.cap .ti .hl { color: var(--hot); }
.cap .su { margin: 24px 0 0; font-size: 29px; line-height: 1.38; color: var(--ink-soft); font-weight: 500; max-width: 920px; }
.w { display: inline-block; white-space: pre; will-change: transform, opacity, filter; }

#pins { position: absolute; inset: 0; pointer-events: none; }
.pill { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 12px; padding: 13px 24px 13px 18px; border-radius: 999px; background: rgba(255,255,255,.97); color: var(--ink); font-size: 24px; font-weight: 700; white-space: nowrap; box-shadow: 0 14px 34px -10px rgba(11,52,70,.28), 0 0 0 1px rgba(11,52,70,.06); opacity: 0; }
.pill i { width: 12px; height: 12px; border-radius: 50%; background: var(--signal); flex: 0 0 auto; }
.pill.hot i { background: var(--hot); }
.pill.hot { color: #fff; background: var(--hot); }
.pill.hot i { background: #fff; }
.pill.muted { color: var(--ink-soft); }
.pill.muted i { background: #b8c3ca; }
.pill small { font-size: 18px; font-weight: 600; color: var(--ink-soft); margin-left: 4px; }
.pill.hot small { color: rgba(255,255,255,.85); }
.tag3 { position: absolute; left: 0; top: 0; padding: 18px 26px; border-radius: 18px; background: rgba(255,255,255,.96); box-shadow: 0 18px 40px -14px rgba(11,52,70,.3), 0 0 0 1px rgba(11,52,70,.06); opacity: 0; white-space: nowrap; }
.tag3 small { display: block; font-size: 16px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--signal); }
.tag3 strong { display: block; font-size: 50px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; margin-top: 6px; line-height: 1.05; }
.tag3 span { display: block; font-size: 19px; color: var(--ink-soft); font-weight: 600; margin-top: 4px; }
.tag3.hot small { color: var(--hot); }
.tag3.hot strong { color: var(--hot); }

.stat { position: absolute; right: 110px; top: 190px; text-align: right; opacity: 0; }
.stat strong { display: block; font-weight: 900; font-size: 190px; letter-spacing: -.06em; line-height: .9; color: var(--hot); font-variant-numeric: tabular-nums; }
.stat span { display: block; margin-top: 16px; font-size: 27px; font-weight: 700; color: var(--ink); }
.stat em { font-style: normal; color: var(--ink-soft); font-weight: 600; }

.note { position: absolute; right: 110px; bottom: 58px; font-size: 15px; font-weight: 600; color: rgba(79,104,115,.85); opacity: 0; text-align: right; max-width: 760px; line-height: 1.4; }

.end { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; padding-top: 330px; box-sizing: border-box; }
.end .wm svg { height: 70px; width: auto; display: block; }
.end .line { margin-top: 40px; font-weight: 800; font-size: 60px; letter-spacing: -.035em; color: var(--ink); }
.end .line b { color: var(--hot); font-weight: 800; }
.end .web { margin-top: 26px; display: inline-flex; align-items: center; gap: 16px; font-size: 32px; font-weight: 800; color: var(--signal); }
.end .web::before { content: ""; width: 13px; height: 13px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 7px rgba(var(--signal-rgb),.16); }

#loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--ink-soft); background: var(--paper); letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }

#controls { display: flex; align-items: center; gap: 14px; width: 100%; box-sizing: border-box; }
#controls button { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; cursor: pointer; display: grid; place-items: center; }
#controls button.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px rgba(11,52,70,.25); }
#controls button:focus-visible, #scrub:focus-visible { outline: 3px solid var(--signal); outline-offset: 3px; }
#controls svg { width: 18px; height: 18px; fill: currentColor; }
#scrub { flex: 1 1 auto; min-width: 0; accent-color: var(--signal); }
#time { flex: 0 0 auto; font-size: 14px; font-weight: 700; color: var(--ink-soft); font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
.capture #app { padding: 0; gap: 0; }
.capture #viewport { border-radius: 0; box-shadow: none; }
.capture #controls { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="viewport">
    <div id="stage">
      <canvas id="gl" width="1920" height="1080"></canvas>
      <div class="vignette"></div>
      <div id="pins"></div>
      <header class="brand" id="brand"><span class="logo-slot"></span><span class="tag">Sama rafmagn, bara ódýrara</span></header>
      <nav class="chapters" id="chapters" aria-label="Kaflar"><div class="bars"></div><div class="name"></div></nav>
      <div id="caps"></div>
      <div class="stat" id="stat"><strong>0%</strong><span></span></div>
      <div class="note" id="note"></div>
      <div class="end" id="end">
        <div class="wm logo-slot"></div>
        <div class="line">Sama rafmagn, <b>bara ódýrara.</b></div>
        <div class="web">straumlind.is</div>
      </div>
      <div id="flash"></div>
      <div class="grain"></div>
      <div id="loading">Hleð inn…</div>
    </div>
  </div>
  <div id="controls">
    <button id="play" type="button" aria-label="Spila eða gera hlé"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4.5v15l13-7.5z"/></svg></button>
    <button id="mute" type="button" class="ghost" aria-label="Hljóð af eða á"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M4 9h4l5-4v14l-5-4H4z"/></svg></button>
    <input id="scrub" type="range" min="0" max="80" step="0.01" value="0" aria-label="Tímalína">
    <div id="time">0:00</div>
  </div>
  <audio id="music" src="music.mp3" preload="auto"></audio>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';

/* ================= facts (checked, see HANDRIT.md for sources) ================= */
const DATA = window.__DATA = {
  sl: 10.54,             // Straumlind, fast verð heimili, kr/kWst m. vsk
  night: 7.03,           // næturverð 23–07
  others: [              // the three largest sellers (about 65% of the market), general household price, kr/kWst m. vsk
    ['Orkusalan', 12.97], ['HS Orka', 12.18], ['Orka náttúrunnar', 11.41],
  ],
  usage: 4500,           // kWst á ári, venjulegt heimili
  ev: 2500,              // kWst á ári fyrir rafbíl
  source: 'Almennt verð á raforku til heimila m. vsk. hjá þremur stærstu raforkusölunum, skv. verðskrám þeirra og aurbjorg.is, október 2026. Dreifing og flutningur eru ekki meðtalin.',
};
const AVG = DATA.others.reduce((s,o)=>s+o[1],0)/DATA.others.length;
const PCT_AVG = Math.round((1-DATA.sl/AVG)*100);
const MAXP = Math.max(...DATA.others.map(o=>o[1]));
const PCT_MAX = Math.round((1-DATA.sl/MAXP)*100);
const SAVE_YEAR = Math.round((MAXP-DATA.sl)*DATA.usage/100)*100;

const W = 1920, H = 1080;
const CAPTURE = location.hash.includes('capture');
if (CAPTURE) document.documentElement.classList.add('capture');

/* ---------- helpers ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rand = mulberry32(20261014);
const R = (a,b)=>a+(b-a)*rand();
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eout=t=>1-Math.pow(1-t,3);
const esine=t=>-(Math.cos(Math.PI*t)-1)/2;
const eback=t=>{const c1=1.6,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const CYAN = new THREE.Color('#00bdd0'), ORANGE = new THREE.Color('#ff7800');
const fmtN=n=>Math.round(n).toLocaleString('de-DE');
const fmtK=n=>n.toFixed(2).replace('.',',');

/* ---------- the timeline: one set (scene) after another, each built from nothing ---------- */
const SETS = {
  city:   {a:0,    b:9.4},
  grid:   {a:9.4,  b:22.6},
  chart:  {a:22.6, b:34.6},
  lean:   {a:34.6, b:41.8},
  ai:     {a:41.8, b:50.4},
  homes:  {a:50.4, b:61.0},
  growth: {a:61.0, b:68.4},
  sw:     {a:68.4, b:75.0},
  end:    {a:75.0, b:81.0},
};
const DUR = 81;
const EXIT = .75;   // how long before a set ends its pieces start to sink back into the floor
const setAt = t => { for(const [k,s] of Object.entries(SETS)) if(t>=s.a && t<s.b) return k; return 'end'; };

/* ---------- renderer ---------- */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: CAPTURE, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const BG = new THREE.Color('#eef1f3');
scene.background = BG;
scene.fog = new THREE.Fog(BG, 160, 520);
const camera = new THREE.PerspectiveCamera(30, W/H, 0.5, 1400);

scene.add(new THREE.HemisphereLight('#ffffff', '#c3ccd3', 1.4));
const sun = new THREE.DirectionalLight('#fffdf8', 2.9);
sun.position.set(-70, 130, 55);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -95, right: 95, top: 95, bottom: -95, near: 20, far: 330 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.05; sun.shadow.radius = 2.2;
scene.add(sun, sun.target);

/* ---------- textures ---------- */
function canvasTex(w,h,draw,{repeat=false}={}){
  const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); draw(g,w,h);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8;
  if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;} return t;
}
const texGround = canvasTex(256,256,(g,w,h)=>{ g.fillStyle='#eef1f3'; g.fillRect(0,0,w,h); g.strokeStyle='rgba(120,140,155,.10)'; g.lineWidth=2; g.strokeRect(0,0,w,h); g.strokeStyle='rgba(120,140,155,.05)'; g.lineWidth=1; g.beginPath(); g.moveTo(w/2,0); g.lineTo(w/2,h); g.moveTo(0,h/2); g.lineTo(w,h/2); g.stroke(); },{repeat:true});
texGround.repeat.set(160,160);
const texGroove = canvasTex(128,128,(g)=>{g.fillStyle='#ffffff';g.fillRect(0,0,128,128);g.fillStyle='#e1e6eb';g.fillRect(0,0,7,128);},{repeat:true});
const texGrid = canvasTex(128,128,(g)=>{g.fillStyle='#ffffff';g.fillRect(0,0,128,128);g.fillStyle='#e0e6ea';g.fillRect(22,28,84,64);g.fillStyle='#f3f6f8';g.fillRect(22,28,84,8);},{repeat:true});
const glowTexOf = (rgb)=>canvasTex(256,256,(g)=>{const r=g.createRadialGradient(128,128,0,128,128,128);r.addColorStop(0,`rgba(${rgb},.5)`);r.addColorStop(.45,`rgba(${rgb},.16)`);r.addColorStop(1,`rgba(${rgb},0)`);g.fillStyle=r;g.fillRect(0,0,256,256);});
const texGlow = glowTexOf('0,189,208'), texGlowHot = glowTexOf('255,120,0');
const texBlob = canvasTex(128,128,(g)=>{const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(20,40,55,.3)');r.addColorStop(1,'rgba(20,40,55,0)');g.fillStyle=r;g.fillRect(0,0,128,128);});

/* ---------- materials ---------- */
const M = {
  ground: new THREE.MeshStandardMaterial({ color:'#ffffff', roughness:1, map:texGround }),
  block:  new THREE.MeshStandardMaterial({ color:'#f6f8f9', roughness:.95 }),
  white:  new THREE.MeshStandardMaterial({ color:'#ffffff', roughness:.88 }),
  groove: new THREE.MeshStandardMaterial({ color:'#ffffff', roughness:.88, map:texGroove }),
  grid:   new THREE.MeshStandardMaterial({ color:'#ffffff', roughness:.88, map:texGrid }),
  detail: new THREE.MeshStandardMaterial({ color:'#e4e9ed', roughness:.9 }),
  base:   new THREE.MeshStandardMaterial({ color:'#e9eef1', roughness:.6 }),
  dash:   new THREE.MeshStandardMaterial({ color:'#ffffff', roughness:1 }),
  tree:   new THREE.MeshStandardMaterial({ color:'#ffffff', roughness:1 }),
  wire:   new THREE.MeshStandardMaterial({ color:'#9fb0bb', roughness:.6 }),
  cyan:   new THREE.MeshStandardMaterial({ color:'#00bdd0', roughness:.5 }),
  cyanSoft: new THREE.MeshStandardMaterial({ color:'#8fe1ea', roughness:.7 }),
  orange: new THREE.MeshStandardMaterial({ color:'#ff7800', roughness:.55 }),
  orangeSoft: new THREE.MeshStandardMaterial({ color:'#ffc08a', roughness:.7 }),
  navy:   new THREE.MeshStandardMaterial({ color:'#1d4a5e', roughness:.6 }),
  dark:   new THREE.MeshStandardMaterial({ color:'#3a4a55', roughness:.6 }),
  water:  new THREE.MeshStandardMaterial({ color:'#a9e4ec', roughness:.25, metalness:.0 }),
  winLit: new THREE.MeshBasicMaterial({ color:'#ffe2b8', toneMapped:false }),
  glowC:  new THREE.MeshBasicMaterial({ color:'#00bdd0', toneMapped:false }),
  glowO:  new THREE.MeshBasicMaterial({ color:'#ff7800', toneMapped:false }),
};
const edgeMat = new THREE.LineBasicMaterial({ color:'#c3ccd4', transparent:true, opacity:.75 });
function outline(geo, grp, angle=20){ const l=new THREE.LineSegments(new THREE.EdgesGeometry(geo, angle), edgeMat); grp.add(l); return l; }
function mesh(geo, mat, grp, {shadow=true, edges=false}={}){ const m=new THREE.Mesh(geo,mat); m.castShadow=m.receiveShadow=shadow; grp.add(m); if(edges) outline(geo,grp); return m; }
function uvBox(geo,w,h,d,u=3){ const uv=geo.attributes.uv; const dims=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]]; for(let f=0;f<6;f++) for(let k=0;k<4;k++){const i=f*4+k; uv.setXY(i,uv.getX(i)*dims[f][0]/u,uv.getY(i)*dims[f][1]/u);} return geo; }

const ground = new THREE.Mesh(new THREE.PlaneGeometry(2400,2400).rotateX(-Math.PI/2), M.ground);
ground.receiveShadow = true; scene.add(ground);

/* ---------- the build-up system ----------
   Every piece knows the windows (start, exit) in which it stands. It grows from the floor at the start
   and sinks back into it at the exit, so each scene starts from an empty plane. */
const ITEMS=[], LINES=[], FLOWS=[], PINS=[];
const SET_GROUPS={};
for(const k of Object.keys(SETS)){ const g=new THREE.Group(); g.name=k; scene.add(g); SET_GROUPS[k]=g; }
function win(set, at, stag=0){ const s=SETS[set]; return {s:s.a+at, e:s.b-EXIT+stag}; }
function rise(o, wins, {dur=.85, mode='y', ease=eback}={}){ o.userData.base=o.scale.clone(); ITEMS.push({o,wins:[].concat(wins),dur,mode,ease}); return o; }
function kOf(it,t){ for(const w of it.wins){ if(t>=w.s-.02 && t<=w.e+.5){ return it.ease(prog(t,w.s,w.s+it.dur))*(1-eio(prog(t,w.e,w.e+.42))); } } return 0; }
function updItems(t){
  for(const it of ITEMS){ const k=kOf(it,t); const b=it.o.userData.base; it.o.visible=k>.002; if(!it.o.visible) continue;
    if(it.mode==='y') it.o.scale.set(b.x,Math.max(1e-4,b.y*k),b.z); else it.o.scale.set(b.x*Math.max(1e-4,k),b.y*Math.max(1e-4,k),b.z*Math.max(1e-4,k)); }
}
// a tube drawn along a curve from one end to the other
function drawTube(curve, grp, wins, {r=.12, mat=M.glowC, dur=1.2, seg=80}={}){
  const geo=new THREE.TubeGeometry(curve,seg,r,6,false); const m=new THREE.Mesh(geo,mat); m.renderOrder=3; grp.add(m);
  LINES.push({m,count:geo.index.count,wins:[].concat(wins),dur}); return m;
}
function updLines(t){ for(const l of LINES){ let g=0,o=0; for(const w of l.wins){ if(t>=w.s&&t<=w.e+.5){ g=eio(prog(t,w.s,w.s+l.dur)); o=1-eio(prog(t,w.e,w.e+.4)); break; } }
  l.m.visible=g>0&&o>0; if(l.m.visible){ l.m.geometry.setDrawRange(0,Math.floor(l.count*g/6)*6); l.m.scale.setScalar(1); if(l.m.material.transparent) l.m.material.opacity=o; else if(o<1){ l.m.geometry.setDrawRange(Math.floor(l.count*(1-o)/6)*6, l.count); } } } }
// glowing dots that flow along a curve (electricity)
const dotGeo=new THREE.SphereGeometry(.26,14,10);
function flow(curve, grp, wins, {n=4, speed=.5, mat=M.glowC, size=1, delay=1.2}={}){
  const dots=[]; for(let i=0;i<n;i++){ const d=new THREE.Mesh(dotGeo,mat); d.scale.setScalar(size); d.renderOrder=4; grp.add(d); dots.push(d); }

  const s=Math.min(avW/W, avH/H); viewport.style.width=(W*s)+'px'; viewport.style.height=(H*s)+'px'; stage.style.transform=`scale(${s})`;
  const q=clamp(s*(window.devicePixelRatio||1),.5,1); renderer.setSize(Math.round(W*q),Math.round(H*q),false);
  document.getElementById('controls').style.width=(W*s)+'px';
}
function syncAudio(){ try{ if(Math.abs(music.currentTime-T)>.25) music.currentTime=T; }catch(e){} }
function setPlaying(p){ playing=p; playIcon.innerHTML=p?ICON_PAUSE:ICON_PLAY; last=performance.now(); if(p&&!muted){ syncAudio(); music.play().catch(()=>{}); } else music.pause(); }
function tick(now){ if(playing){ T+=Math.min(.1,(now-last)/1000); last=now; if(T>=DUR){T=DUR; setPlaying(false);} render(T); scrub.value=T; timeEl.textContent=`${mmss(T)} / ${mmss(DUR)}`; } requestAnimationFrame(tick); }
playBtn.addEventListener('click',()=>{ if(T>=DUR) T=0; setPlaying(!playing); });
muteBtn.addEventListener('click',()=>{ muted=!muted; muteBtn.style.opacity=muted?.45:1; if(muted) music.pause(); else if(playing){ syncAudio(); music.play().catch(()=>{}); } });
scrub.addEventListener('input',()=>{ T=parseFloat(scrub.value); render(T); syncAudio(); timeEl.textContent=`${mmss(T)} / ${mmss(DUR)}`; });
window.addEventListener('resize',()=>{ layout(); render(T); });
window.addEventListener('keydown',e=>{ if(e.code==='Space'&&e.target===document.body){ e.preventDefault(); playBtn.click(); } });

window.__ready = (async()=>{ layout(); await init(); render(0); timeEl.textContent=`0:00 / ${mmss(DUR)}`;
  if(CAPTURE) return true; requestAnimationFrame(tick); return true; })();
window.__seek = (t)=>{ render(t); return true; };
</script>
</body>
</html>
