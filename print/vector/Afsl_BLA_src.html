<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500&display=swap">
<style>
html,body{margin:0;padding:0;width:794px;height:794px;overflow:hidden}
@page{margin:0}
.page{width:794px;height:794px;box-sizing:border-box;position:relative;overflow:hidden;color:#20233F;font-family:Inter,sans-serif;
  background-color:#F4F5FA;
  background-image:linear-gradient(rgba(70,85,160,0.09) 1px,transparent 1px),linear-gradient(90deg,rgba(70,85,160,0.09) 1px,transparent 1px);
  background-size:44px 44px;background-position:9px 9px}
.sq{position:absolute;width:9px;height:9px;border:1.5px solid rgba(70,85,160,0.55);box-sizing:border-box}
.sq.f{background:rgba(70,85,160,0.35);border:0;width:8px;height:8px}
.label{position:absolute;left:0;right:0;top:62px;text-align:center;font-family:Montserrat,sans-serif;font-weight:700;font-size:11.5px;letter-spacing:3.2px;color:#3B5BD9;text-transform:uppercase}
h1{position:absolute;left:0;right:0;top:80px;margin:0;text-align:center;font-family:Montserrat,sans-serif;font-weight:800;font-size:50px;letter-spacing:-1.2px;color:#20233F}
.lede{position:absolute;left:90px;right:90px;top:146px;text-align:center;font-size:16.5px;line-height:1.5;color:#3A3D58}
.ring{position:absolute;left:112px;top:250px;width:570px;height:320px;display:block;object-fit:contain}
.btn{position:absolute;left:50%;top:694px;transform:translateX(-50%);background:#3B5BD9;color:#fff;border-radius:999px;padding:14px 30px 14px 26px;font-family:Montserrat,sans-serif;font-weight:700;font-size:14.5px;white-space:nowrap;box-shadow:0 10px 24px rgba(59,91,217,0.28);display:flex;align-items:center;gap:12px}
.btn svg{width:16px;height:16px;display:block}
</style>
</head>
<body>
<div class="page">
  <div class="sq" style="left:58px;top:58px"></div>
  <div class="sq f" style="left:78px;top:80px"></div>
  <div class="sq f" style="left:700px;top:48px"></div>
  <div class="sq" style="left:722px;top:70px"></div>
  <div class="sq f" style="left:62px;top:478px"></div>
  <div class="sq" style="left:88px;top:556px"></div>
  <div class="sq" style="left:724px;top:512px"></div>
  <div class="sq f" style="left:694px;top:580px"></div>
  <div class="sq" style="left:56px;top:734px"></div>
  <div class="sq f" style="left:728px;top:726px"></div>
  <div class="label">Sértilboð fyrir nýja húseigendur</div>
  <h1>Afsláttarmiðar</h1>
  <div class="lede">Nokkur fyrirtækjanna í bókinni taka á móti nýjum húseigendum með sérstökum afslætti. Klipptu miðana út og taktu þá með.</div>
  <img class="ring" src="RINGSRC" alt="Afsláttarmiðar í hring: Parki, sticker.is, Íspan, Ormsson, gardinur.is og Maus">
  <div class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M13 5l7 7-7 7"/></svg>Alla afsláttarmiðana finnur þú aftast í bókinni</div>
</div>
</body>
</html>
