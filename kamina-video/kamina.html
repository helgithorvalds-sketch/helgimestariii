<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reykrör fyrir kamínu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&display=swap">
<style>
/* One fixed 16:9 stage (1920×1080) scaled to fit, slim transport bar beneath.
   Look: white clay model house on a blueprint sheet, see-through front and roof,
   the parts in their real colours (black pipe, steel sleeve) and one accent for measuring and focus. */
:root {
  --paper: #eef0f3;
  --ink: #141821;
  --ink-soft: #545b69;
  --signal: #ee7a2f;     /* accent: swap for the company colour */
  --signal-rgb: 238,122,47;
  --frame: #dfe2e7;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--frame); color: var(--ink); font-family: var(--body); overflow: hidden; }
#app { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding-inline: 16px; box-sizing: border-box; }
#viewport { position: relative; width: 100%; flex: 0 0 auto; overflow: hidden; border-radius: 14px; box-shadow: 0 30px 80px -30px rgba(20,24,33,.35), 0 0 0 1px rgba(20,24,33,.06); background: var(--paper); }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: var(--paper); }
#gl { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
.vignette { position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 62% 58% at 10% 100%, rgba(238,240,243,.94), rgba(238,240,243,0) 72%),
    radial-gradient(ellipse 120% 90% at 50% 50%, rgba(20,24,33,0) 62%, rgba(20,24,33,.08) 100%); }
.grain { position: absolute; inset: 0; pointer-events: none; opacity: .045; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

.brand { position: absolute; left: 110px; top: 84px; display: flex; align-items: center; gap: 20px; }
.brand .name { font-family: var(--display); font-weight: 800; font-size: 36px; letter-spacing: -.02em; }
.brand .tag { font-size: 21px; font-weight: 600; color: var(--ink-soft); letter-spacing: .02em; }
.brand .name:not(:empty) + .tag { padding-left: 20px; border-left: 1.5px solid rgba(20,24,33,.18); }

.chapters { position: absolute; right: 110px; top: 92px; display: flex; flex-direction: column; align-items: flex-end; gap: 14px; }
.chapters .bars { display: flex; gap: 8px; }
.chapters .bar { width: 56px; height: 4px; border-radius: 2px; background: rgba(20,24,33,.12); overflow: hidden; }
.chapters .bar i { display: block; height: 100%; width: 0; background: var(--signal); }
.chapters .name { font-size: 19px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.chapters .name b { color: var(--signal); font-weight: 700; margin-right: 12px; }

.cap { position: absolute; left: 110px; bottom: 100px; width: 1000px; opacity: 0; }
.cap .eb { display: flex; align-items: center; gap: 14px; font-size: 21px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--signal); margin-bottom: 20px; }
.cap .eb .num { display: inline-grid; place-items: center; min-width: 44px; height: 44px; padding: 0 6px; box-sizing: border-box; border-radius: 22px; background: var(--signal); color: #fff; letter-spacing: 0; font-size: 22px; }
.cap .eb .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 6px rgba(var(--signal-rgb),.16); }
.cap .ti { margin: 0; font-family: var(--display); font-weight: 700; font-size: 72px; line-height: 1.02; letter-spacing: -.026em; color: var(--ink); text-wrap: balance; font-variation-settings: "opsz" 96; }
.cap .su { margin: 24px 0 0; font-size: 30px; line-height: 1.38; color: var(--ink-soft); font-weight: 500; max-width: 880px; text-wrap: pretty; }
.w { display: inline-block; white-space: pre; will-change: transform, opacity, filter; }

#pins { position: absolute; inset: 0; pointer-events: none; }
.pill { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 12px; padding: 12px 22px 12px 16px; border-radius: 999px; background: rgba(255,255,255,.96); color: var(--ink); font-size: 24px; font-weight: 600; white-space: nowrap; box-shadow: 0 14px 34px -10px rgba(20,24,33,.28), 0 0 0 1px rgba(20,24,33,.06); opacity: 0; }
.pill i { width: 11px; height: 11px; border-radius: 50%; background: var(--signal); }
.pill.dim { background: var(--signal); color: #fff; font-family: var(--display); font-weight: 700; font-size: 30px; padding: 10px 22px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; box-shadow: 0 14px 34px -10px rgba(var(--signal-rgb),.6); }
.pill.dim small { font-family: var(--body); font-size: 19px; font-weight: 600; opacity: .9; letter-spacing: .02em; }
.pill.ghost { background: rgba(255,255,255,.9); border: 2px dashed rgba(var(--signal-rgb),.9); box-shadow: none; }

.end { position: absolute; left: 110px; bottom: 110px; opacity: 0; }
.end .big { font-family: var(--display); font-weight: 750; font-size: 120px; letter-spacing: -.035em; line-height: 1; }
.end .line { margin-top: 30px; font-size: 34px; font-weight: 500; color: var(--ink-soft); }
.end .who { margin-top: 34px; display: inline-flex; align-items: center; gap: 16px; font-family: var(--display); font-size: 40px; font-weight: 800; color: var(--ink); }
.end .who::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 7px rgba(var(--signal-rgb),.16); }
.end .who:empty { display: none; }

#loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; color: var(--ink-soft); background: var(--paper); letter-spacing: .1em; text-transform: uppercase; font-weight: 600; }

#controls { display: flex; align-items: center; gap: 14px; width: 100%; box-sizing: border-box; }
#controls button { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; cursor: pointer; display: grid; place-items: center; }
#controls button.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px rgba(20,24,33,.25); }
#controls button:focus-visible, #scrub:focus-visible { outline: 3px solid var(--signal); outline-offset: 3px; }
#controls svg { width: 18px; height: 18px; fill: currentColor; }
#scrub { flex: 1 1 auto; min-width: 0; accent-color: var(--signal); }
#time { flex: 0 0 auto; font-size: 14px; font-weight: 600; color: var(--ink-soft); font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
.capture #app { padding: 0; gap: 0; }
.capture #viewport { border-radius: 0; box-shadow: none; }
.capture #controls { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="viewport">
    <div id="stage">
      <canvas id="gl" width="1920" height="1080"></canvas>
      <div class="vignette"></div>
      <div id="pins"></div>
      <header class="brand" id="brand"><span class="name" id="brandName"></span><span class="tag">Uppsetning á reykröri fyrir kamínu</span></header>
      <nav class="chapters" id="chapters" aria-label="Kaflar"><div class="bars"></div><div class="name"></div></nav>
      <div id="caps"></div>
      <div class="end" id="end">
        <div class="big">Tilbúið.</div>
        <div class="line">Reykrörið er komið upp og kamínan er klár í notkun.</div>
        <div class="who" id="endName"></div>
      </div>
      <div class="grain"></div>
      <div id="loading">Hleð inn húsinu…</div>
    </div>
  </div>
  <div id="controls">
    <button id="play" type="button" aria-label="Spila eða gera hlé"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4.5v15l13-7.5z"/></svg></button>
    <button id="mute" type="button" class="ghost" aria-label="Hljóð af eða á"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M4 9h4l5-4v14l-5-4H4z"/></svg></button>
    <input id="scrub" type="range" min="0" max="102" step="0.01" value="0" aria-label="Tímalína">
    <div id="time">0:00 / 1:42</div>
  </div>
  <audio id="music" src="music.mp3" preload="auto"></audio>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ---------- brand: fill in the company name and colour ---------- */
const BRAND = { name: '', accent: '#ee7a2f' };

const W = 1920, H = 1080, DUR = 102;
const CAPTURE = location.hash.includes('capture');
if (CAPTURE) document.documentElement.classList.add('capture');
{ const c=new THREE.Color(BRAND.accent); const r=document.documentElement.style; r.setProperty('--signal',BRAND.accent); r.setProperty('--signal-rgb',`${Math.round(c.r*255)},${Math.round(c.g*255)},${Math.round(c.b*255)}`); }
document.getElementById('brandName').textContent = BRAND.name;
document.getElementById('endName').textContent = BRAND.name;

/* ---------- helpers ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eout=t=>1-Math.pow(1-t,3);
const esine=t=>-(Math.cos(Math.PI*t)-1)/2;
const eback=t=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const env=(t,a,b,fi=.5,fo=.5)=>Math.min(eio(prog(t,a,a+fi)),1-eio(prog(t,b-fo,b)));
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const UP=V(0,1,0);
const fmt=(x,d=2)=>x.toFixed(d).replace('.',',');

/* ---------- dimensions of the model (metres) ---------- */
const HX=5, HZ=4, OVER=.45, HW=2.7;                 // half length, half width, eave overhang, wall height
const TH=Math.PI/6, TAN=Math.tan(TH), COS=Math.cos(TH), SIN=Math.sin(TH);   // 30° roof pitch
const RT=.25, TV=RT/COS;                            // roof thickness (perpendicular / vertical)
const RU=HW+HZ*TAN;                                 // ridge, underside
const under=z=>RU-Math.abs(z)*TAN, top=z=>under(z)+TV;
const RIDGE_TOP=top(0);
const AX=-1.5, AZ=1.6;                              // stove flue axis
const OUT_Y=1.0;                                    // top of the stove outlet
const PIPE_BOT=.92, PIPE_TOP=RIDGE_TOP+.06, PIPE_LEN=PIPE_TOP-PIPE_BOT, OFFCUT=.3;
const ROOF_AT=top(AZ), CEIL_AT=under(AZ);
const SLV_BOT=CEIL_AT-.14;                          // sleeve runs from just under the ceiling up to ridge height
const GY=-.3;                                       // ground level
const N_SLOPE=V(0,COS,SIN), D_SLOPE=V(0,-SIN,COS), X_AX=V(1,0,0);
const P_TOP=V(AX,ROOF_AT,AZ), P_CEIL=V(AX,CEIL_AT,AZ);

/* ---------- renderer ---------- */
const canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:CAPTURE});
renderer.setPixelRatio(1);
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.08;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const BG=new THREE.Color('#eef0f3'); scene.background=BG; scene.fog=new THREE.Fog(BG,40,95);
const camera=new THREE.PerspectiveCamera(32,W/H,.1,300);
camera.setViewOffset(W,H,-250,95,W,H);             // keeps the subject up and to the right, clear of the captions
scene.add(new THREE.HemisphereLight('#ffffff','#c3c9d4',1.3));
const sun=new THREE.DirectionalLight('#fffaf3',2.9); sun.position.set(-9,18,12); sun.castShadow=true;
sun.shadow.mapSize.set(4096,4096); Object.assign(sun.shadow.camera,{left:-16,right:16,top:16,bottom:-16,near:1,far:60});
sun.shadow.bias=-.0004; sun.shadow.normalBias=.03; sun.shadow.radius=2.5; scene.add(sun,sun.target);
const fill=new THREE.DirectionalLight('#eef3ff',.55); fill.position.set(12,6,-6); scene.add(fill);

function canvasTex(w,h,draw,{repeat=false}={}){ const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); draw(g,w,h);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; if(repeat) t.wrapS=t.wrapT=THREE.RepeatWrapping; return t; }
const ACC=new THREE.Color(BRAND.accent);
const accRGB=`${Math.round(ACC.r*255)},${Math.round(ACC.g*255)},${Math.round(ACC.b*255)}`;
const texGlow=canvasTex(256,256,g=>{const r=g.createRadialGradient(128,128,0,128,128,128);r.addColorStop(0,`rgba(${accRGB},.55)`);r.addColorStop(.45,`rgba(${accRGB},.16)`);r.addColorStop(1,`rgba(${accRGB},0)`);g.fillStyle=r;g.fillRect(0,0,256,256);});
const texFire=canvasTex(256,256,g=>{const r=g.createRadialGradient(128,150,0,128,140,128);r.addColorStop(0,'rgba(255,214,140,1)');r.addColorStop(.35,'rgba(255,140,50,.85)');r.addColorStop(1,'rgba(255,90,20,0)');g.fillStyle=r;g.fillRect(0,0,256,256);});
const texSeam=canvasTex(128,128,g=>{g.fillStyle='#f4f5f8';g.fillRect(0,0,128,128);g.fillStyle='#dfe3ea';g.fillRect(0,0,6,128);},{repeat:true});

/* blueprint sheet under the house, as in the reference: faint grid, plan outlines and dimension lines */
const SHEET=34;
const texSheet=canvasTex(3072,3072,(g,w,h)=>{
  const s=w/SHEET, X=x=>(x+SHEET/2)*s, Z=z=>(z+SHEET/2)*s;
  g.fillStyle='#f7f8fa'; g.fillRect(0,0,w,h);
  g.strokeStyle='rgba(120,132,160,.10)'; g.lineWidth=2; g.beginPath(); for(let k=0;k<=SHEET*2;k++){const p=k*s/2; g.moveTo(p,0);g.lineTo(p,h);g.moveTo(0,p);g.lineTo(w,p);} g.stroke();
  g.strokeStyle='rgba(84,94,118,.32)'; g.lineWidth=5;
  const rect=(x0,z0,x1,z1)=>g.strokeRect(X(x0),Z(z0),X(x1)-X(x0),Z(z1)-Z(z0));
  rect(-13.5,7,-6.5,12.5); rect(-13.5,7,-10.5,10); rect(-10.5,7,-6.5,12.5); rect(7,-12.5,13.5,-7); rect(9.5,-12.5,13.5,-9.5); rect(-13.5,-12.5,-8,-8);
  g.lineWidth=3; rect(-12.8,7.6,-11.2,9.4); rect(7.6,-11.8,9,-8);
  g.strokeStyle='rgba(84,94,118,.28)'; g.lineWidth=3;
  const dimH=(x0,x1,z)=>{g.beginPath();g.moveTo(X(x0),Z(z));g.lineTo(X(x1),Z(z));for(const x of [x0,x1]){g.moveTo(X(x)-12,Z(z)+12);g.lineTo(X(x)+12,Z(z)-12);g.moveTo(X(x),Z(z)-26);g.lineTo(X(x),Z(z)+26);}g.stroke();};
  const dimV=(z0,z1,x)=>{g.beginPath();g.moveTo(X(x),Z(z0));g.lineTo(X(x),Z(z1));for(const z of [z0,z1]){g.moveTo(X(x)-12,Z(z)+12);g.lineTo(X(x)+12,Z(z)-12);g.moveTo(X(x)-26,Z(z));g.lineTo(X(x)+26,Z(z));}g.stroke();};
  dimH(-5.3,5.3,-5.6); dimV(-4.3,4.3,-6.4); dimH(-13.5,-6.5,13.3); dimV(-12.5,-7,14.2); dimH(7,13.5,-13.3);
  g.fillStyle='rgba(84,94,118,.5)'; g.font='600 46px "Instrument Sans", Arial'; g.textAlign='center';
  g.fillText('10 600',X(0),Z(-5.6)-22); g.save(); g.translate(X(-6.4)-22,Z(0)); g.rotate(-Math.PI/2); g.fillText('8 600',0,0); g.restore();
  g.fillText('7 000',X(-10),Z(13.3)-22);
});

/* ---------- materials ---------- */
const M={
  sheet:new THREE.MeshStandardMaterial({map:texSheet,roughness:1}),
  ground:new THREE.MeshStandardMaterial({color:'#eceef2',roughness:1}),
  white:new THREE.MeshStandardMaterial({color:'#ffffff',roughness:.9}),
  wall:new THREE.MeshStandardMaterial({color:'#fbfbfc',roughness:.92}),
  base:new THREE.MeshStandardMaterial({color:'#e8ebf0',roughness:.8}),
  floor:new THREE.MeshStandardMaterial({color:'#efe6da',roughness:.85}),
  rug:new THREE.MeshStandardMaterial({color:'#e3e6ec',roughness:1}),
  soft:new THREE.MeshStandardMaterial({color:'#e9ecf1',roughness:.95}),
  win:new THREE.MeshStandardMaterial({color:'#dfe6ef',roughness:.25}),
  seam:new THREE.MeshStandardMaterial({map:texSeam,roughness:.85}),
  roofGlass:new THREE.MeshStandardMaterial({color:'#e7ecf3',roughness:.4,transparent:true,opacity:.26,depthWrite:false,side:THREE.DoubleSide}),
  frontGlass:new THREE.MeshStandardMaterial({color:'#e3eaf3',roughness:.2,transparent:true,opacity:.16,depthWrite:false,side:THREE.DoubleSide}),
  disc:new THREE.MeshStandardMaterial({color:'#f0f2f6',roughness:.8}),
  hole:new THREE.MeshBasicMaterial({color:'#2a2e36',transparent:true,opacity:0,depthWrite:false}),
  stove:new THREE.MeshStandardMaterial({color:'#2b2f37',roughness:.55,metalness:.25}),
  door:new THREE.MeshStandardMaterial({color:'#171a20',roughness:.15,metalness:.1}),
  hearth:new THREE.MeshStandardMaterial({color:'#e2e0dc',roughness:.9}),
  pipe:new THREE.MeshStandardMaterial({color:'#343840',roughness:.42,metalness:.3}),
  steel:new THREE.MeshStandardMaterial({color:'#c9cfd8',roughness:.38,metalness:.35}),
  steelDark:new THREE.MeshStandardMaterial({color:'#8d95a1',roughness:.4,metalness:.35}),
  inner:new THREE.MeshStandardMaterial({color:'#2a2e35',roughness:.9,side:THREE.BackSide}),
  acc:new THREE.MeshBasicMaterial({color:ACC,toneMapped:false}),
  accT:new THREE.MeshBasicMaterial({color:ACC,toneMapped:false,transparent:true,opacity:1,depthWrite:false}),
  ghost:new THREE.MeshBasicMaterial({color:ACC,toneMapped:false,transparent:true,opacity:0,depthWrite:false}),
  plumb:new THREE.MeshBasicMaterial({color:'#3a3f4a',transparent:true,opacity:1}),
  tree:new THREE.MeshStandardMaterial({color:'#ffffff',roughness:1}),
  trunk:new THREE.MeshStandardMaterial({color:'#eceff3',roughness:1}),
};
const edgeMat=new THREE.LineBasicMaterial({color:'#bfc6d3',transparent:true,opacity:.8});
const edgeSoft=new THREE.LineBasicMaterial({color:'#aab3c2',transparent:true,opacity:.55});
function outline(mesh,parent=mesh.parent,mat=edgeMat,angle=25){ const l=new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry,angle),mat); l.position.copy(mesh.position); l.quaternion.copy(mesh.quaternion); l.scale.copy(mesh.scale); parent.add(l); return l; }
function mesh(geo,mat,parent,{x=0,y=0,z=0,shadow=true,edge=true,edgeM=edgeMat}={}){ const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); m.castShadow=m.receiveShadow=shadow; parent.add(m); if(edge) outline(m,parent,edgeM); return m; }

/* ---------- ground + blueprint ---------- */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),M.ground); ground.rotation.x=-Math.PI/2; ground.position.y=GY-.01; ground.receiveShadow=true; scene.add(ground);
const sheet=new THREE.Mesh(new THREE.PlaneGeometry(SHEET,SHEET),M.sheet); sheet.rotation.x=-Math.PI/2; sheet.position.y=GY; sheet.receiveShadow=true; scene.add(sheet);

/* ---------- the house ---------- */
const house=new THREE.Group(); scene.add(house);
mesh(new RoundedBoxGeometry(2*HX+1.2,.3,2*HZ+1.2,2,.08),M.base,house,{y:GY+.15});
mesh(new THREE.BoxGeometry(2*HX,.04,2*HZ),M.floor,house,{y:.02,edge:false});
// steps up to the open front
for(let k=0;k<2;k++) mesh(new THREE.BoxGeometry(2.4,.15,.42),M.white,house,{x:2.6,y:GY+.075+k*.15,z:HZ+.6+.42*(1-k)+.21});
// back wall with windows
mesh(new THREE.BoxGeometry(2*HX+.2,HW,.2),M.wall,house,{y:HW/2,z:-HZ});
for(const x of [-3.2,2.9]){ mesh(new THREE.BoxGeometry(1.6,1.3,.04),M.win,house,{x,y:1.55,z:-HZ+.12,shadow:false}); }
// gable walls
const gableShape=new THREE.Shape(); gableShape.moveTo(-HZ,0); gableShape.lineTo(HZ,0); gableShape.lineTo(0,HZ*TAN); gableShape.closePath();
for(const sx of [-1,1]){
  mesh(new THREE.BoxGeometry(.2,HW,2*HZ),M.wall,house,{x:sx*HX,y:HW/2});
  const gg=new THREE.ExtrudeGeometry(gableShape,{depth:.2,bevelEnabled:false}); gg.rotateY(Math.PI/2); gg.translate(-.1,0,0);
  mesh(gg,M.wall,house,{x:sx*HX,y:HW});
  mesh(new THREE.BoxGeometry(.04,1.5,1.9),M.win,house,{x:sx*(HX+.12),y:1.5,z:-1.2,shadow:false});
}
// open, glazed front: thin frame, glass you can see straight through
const front=new THREE.Mesh(new THREE.BoxGeometry(2*HX,HW,.03),M.frontGlass); front.position.set(0,HW/2,HZ); front.renderOrder=2; house.add(front); outline(front,house,edgeSoft);

  ev.push({k:'plumb',t:TL.plumb+1.5},{k:'drill',t:TL.drill},{k:'pin',t:TL.pin+.3});
  for(const k of ['dim2','dim2b','dim4','dim5']) ev.push({k:'dim',t:TL[k]+1.0});
  ev.push({k:'dim',t:TL.pitch+1.5},{k:'dash',t:TL.dash});
  ev.push({k:'place',t:TL.slvSet},{k:'cut',t:TL.cut},{k:'slide',t:TL.offcut},{k:'place',t:TL.collar+1.4},{k:'weld',t:TL.weld});
  ev.push({k:'ghost',t:TL.damper+.4},{k:'saw',t:TL.saw},{k:'lift',t:TL.discOut},{k:'place',t:TL.discOut+2.2});
  ev.push({k:'lift',t:TL.asmLift},{k:'place',t:TL.asmSet},{k:'lift',t:TL.pipeLift},{k:'slide',t:TL.pipeDown},{k:'land',t:TL.pipeSet});
  ev.push({k:'lift',t:TL.cowlLift},{k:'land',t:TL.cowlSet},{k:'fire',t:TL.fire},{k:'end',t:TL.end+.1});
  return {dur:DUR, tl:TL, events:ev.sort((a,b)=>a.t-b.t)};
}
window.__events=soundEvents;

/* ---------- playback ---------- */
const viewport=document.getElementById('viewport'), stage=document.getElementById('stage');
const scrub=document.getElementById('scrub'), timeEl=document.getElementById('time'), playBtn=document.getElementById('play'), playIcon=document.getElementById('playIcon');
const music=document.getElementById('music'), muteBtn=document.getElementById('mute');
let playing=false, T=0, last=0, muted=false;
const ICON_PLAY='<path d="M7 4.5v15l13-7.5z"/>', ICON_PAUSE='<path d="M6 4.5h4v15H6zM14 4.5h4v15h-4z"/>';
const mmss=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
scrub.max=DUR; timeEl.textContent=`0:00 / ${mmss(DUR)}`;
function layout(){
  if(CAPTURE){ viewport.style.width=W+'px'; viewport.style.height=H+'px'; stage.style.transform='none'; renderer.setPixelRatio(window.__px||1.5); renderer.setSize(W,H,false); return; }
  const avW=document.getElementById('app').clientWidth-32, avH=window.innerHeight-80;
  const s=Math.min(avW/W,avH/H); viewport.style.width=(W*s)+'px'; viewport.style.height=(H*s)+'px'; stage.style.transform=`scale(${s})`;
  const q=clamp(s*(window.devicePixelRatio||1),.5,1); renderer.setSize(Math.round(W*q),Math.round(H*q),false);
  document.getElementById('controls').style.width=(W*s)+'px';
}
function syncAudio(){ try{ if(Math.abs(music.currentTime-T)>.25) music.currentTime=T; }catch(e){} }
function setPlaying(p){ playing=p; playIcon.innerHTML=p?ICON_PAUSE:ICON_PLAY; last=performance.now(); if(p&&!muted){ syncAudio(); music.play().catch(()=>{}); } else music.pause(); }
function tick(now){ if(playing){ T+=Math.min(.1,(now-last)/1000); last=now; if(T>=DUR){T=DUR; setPlaying(false);} render(T); scrub.value=T; timeEl.textContent=`${mmss(T)} / ${mmss(DUR)}`; } requestAnimationFrame(tick); }
playBtn.addEventListener('click',()=>{ if(T>=DUR) T=0; setPlaying(!playing); });
muteBtn.addEventListener('click',()=>{ muted=!muted; muteBtn.style.opacity=muted?.45:1; if(muted) music.pause(); else if(playing){ syncAudio(); music.play().catch(()=>{}); } });
scrub.addEventListener('input',()=>{ T=parseFloat(scrub.value); render(T); syncAudio(); timeEl.textContent=`${mmss(T)} / ${mmss(DUR)}`; });
window.addEventListener('resize',()=>{ layout(); render(T); });
window.addEventListener('keydown',e=>{ if(e.code==='Space'&&e.target===document.body){ e.preventDefault(); playBtn.click(); } });

window.__ready=(async()=>{ layout();
  try{ await Promise.race([Promise.all([document.fonts.load('700 100px "Bricolage Grotesque"'),document.fonts.load('750 100px "Bricolage Grotesque"'),document.fonts.load('600 40px "Instrument Sans"'),document.fonts.load('500 40px "Instrument Sans"'),document.fonts.load('700 40px "Instrument Sans"')]),new Promise(r=>setTimeout(r,4000))]); }catch(e){}
  document.getElementById('loading').hidden=true; render(0);
  if(CAPTURE) return true; T=0; render(T); requestAnimationFrame(tick); return true; })();
window.__seek=(t)=>{ render(t); return true; };
</script>
