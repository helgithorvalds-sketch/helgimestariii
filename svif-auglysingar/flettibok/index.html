<!doctype html><html lang="is"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>SVIF velkomstbók</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&display=swap">
<style>
/* Layout: one 3D book on a lilac grid desk (the cover's own grid); rigid sheets that turn with live shading, laminated covers that overhang the block. */
:root{
  --grunnur:#E9E7F2; --grunnur-dypri:#D9D6E8; --rud:rgba(90,96,140,.10); --blek:#2B2836; --blek-mjukt:#7B7690;
  --pappir:#FFFFFF; --pappir-kantur:#e4e4ea; --skuggi:rgba(43,40,54,.34); --hnappur:#FFFFFF; --hnappur-blek:#2B2836; --hnappur-virkur:#2B2836; --hnappur-virkur-blek:#FFFFFF;
  --display:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --grunnur:#221F2C; --grunnur-dypri:#17151F; --rud:rgba(170,175,220,.07); --blek:#EDEBF5; --blek-mjukt:#8E88A6; --pappir-kantur:#cfcfd8;
    --skuggi:rgba(0,0,0,.6); --hnappur:#312E3F; --hnappur-blek:#EDEBF5; --hnappur-virkur:#EDEBF5; --hnappur-virkur-blek:#2B2836; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --grunnur:#221F2C; --grunnur-dypri:#17151F; --rud:rgba(170,175,220,.07); --blek:#EDEBF5; --blek-mjukt:#8E88A6; --pappir-kantur:#cfcfd8;
  --skuggi:rgba(0,0,0,.6); --hnappur:#312E3F; --hnappur-blek:#EDEBF5; --hnappur-virkur:#EDEBF5; --hnappur-virkur-blek:#2B2836; color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    linear-gradient(var(--rud) 1px,transparent 1px) 0 0/28px 28px,
    linear-gradient(90deg,var(--rud) 1px,transparent 1px) 0 0/28px 28px,
    radial-gradient(120% 90% at 50% 30%,var(--grunnur) 0%,var(--grunnur-dypri) 100%);
  color:var(--blek);font-family:var(--display);overflow:hidden;user-select:none;-webkit-user-select:none;
}
.haus{position:fixed;left:28px;top:calc(22px + env(safe-area-inset-top,0px));z-index:50}
.haus .merki{font-weight:700;font-size:15px;letter-spacing:.30em}
.haus .undir{font-size:11px;letter-spacing:.14em;color:var(--blek-mjukt);margin-top:3px;text-transform:uppercase}
.stilling{position:fixed;right:28px;top:calc(22px + env(safe-area-inset-top,0px));z-index:50;display:flex;gap:8px}
.pilla{display:flex;background:var(--hnappur);border-radius:999px;padding:3px;box-shadow:0 2px 10px rgba(20,17,30,.14)}
.pilla button{border:0;background:transparent;color:var(--hnappur-blek);font:600 12px/1 var(--display);letter-spacing:.06em;padding:8px 13px;border-radius:999px;cursor:pointer}
.pilla button[aria-pressed="true"]{background:var(--hnappur-virkur);color:var(--hnappur-virkur-blek)}
.pilla button:focus-visible{outline:2px solid var(--blek);outline-offset:2px}

.svid{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;perspective:2400px;perspective-origin:50% 40%}
:root{--p:min(41vw,62vh);--th:14px}
.halli{transform-style:preserve-3d;transform:rotateX(14deg);transition:transform .8s ease}
body.flatt .halli{transform:none}
body.flatt .svid{perspective:none}
.bok{position:relative;width:calc(var(--p)*2);height:var(--p);transform-style:preserve-3d;transition:transform .9s cubic-bezier(.4,.1,.2,1)}

.golfskuggi{position:absolute;left:50%;top:calc(100% + 1.5vh);width:calc(var(--p)*1.9);height:calc(var(--p)*.18);
  transform:translateX(-50%) rotateX(84deg);border-radius:50%;background:radial-gradient(closest-side,var(--skuggi),transparent 72%);filter:blur(8px);pointer-events:none}
body.flatt .golfskuggi{display:none}

/* page block under each side: stacked edge lines + striped fore-edges, flat, always behind the sheets */
.blokk{position:absolute;top:0;width:var(--p);height:var(--p);pointer-events:none;z-index:0}
.blokk.h{left:50%}.blokk.v{right:50%}
.blokk .topp{position:absolute;inset:0;background:var(--pappir);border-radius:1px;
  box-shadow:1px 1px 0 var(--pappir-kantur),2px 2px 0 #fff,3px 3px 0 var(--pappir-kantur),4px 4px 0 #fff,5px 5px 0 var(--pappir-kantur),6px 6px 0 #fff,7px 7px 0 var(--pappir-kantur),8px 8px 0 #fff,9px 9px 0 var(--pappir-kantur),0 16px 30px rgba(20,17,30,.22)}
.blokk.v .topp{box-shadow:-1px 1px 0 var(--pappir-kantur),-2px 2px 0 #fff,-3px 3px 0 var(--pappir-kantur),-4px 4px 0 #fff,-5px 5px 0 var(--pappir-kantur),-6px 6px 0 #fff,-7px 7px 0 var(--pappir-kantur),-8px 8px 0 #fff,-9px 9px 0 var(--pappir-kantur),0 16px 30px rgba(20,17,30,.22)}
.blokk .botn{position:absolute;left:0;top:100%;width:100%;height:var(--th);transform-origin:top left;transform:skewX(-42deg) translateX(1px);
  background:repeating-linear-gradient(180deg,#f7f7f9 0 1px,#d9d9e1 1px 2px);opacity:.95}
.blokk.v .botn{transform-origin:top right;transform:skewX(42deg) translateX(-1px)}
.blokk .kantur{position:absolute;top:0;left:100%;width:var(--th);height:100%;transform-origin:top left;transform:skewY(-42deg) translateY(1px);
  background:repeating-linear-gradient(90deg,#f7f7f9 0 1px,#d9d9e1 1px 2px);opacity:.95}
.blokk.v .kantur{left:auto;right:100%;transform-origin:top right;transform:skewY(42deg) translateY(1px)}
/* shadow the turning sheet casts on the page it is leaving / landing on */
.kast{position:absolute;top:0;width:50%;height:100%;pointer-events:none;opacity:0;z-index:30}
.kast.h{left:50%;background:linear-gradient(90deg,rgba(20,17,30,.45),rgba(20,17,30,.08) 45%,transparent 80%)}
.kast.v{left:0;background:linear-gradient(270deg,rgba(20,17,30,.45),rgba(20,17,30,.08) 45%,transparent 80%)}

/* a sheet: one rigid element, front and back faces */
.blad{position:absolute;left:50%;top:0;width:var(--p);height:var(--p);transform-style:preserve-3d;transform-origin:left center}
.flotur{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--pappir);overflow:hidden;border-radius:1.5px;box-shadow:0 1px 3px rgba(20,17,30,.18)}
.flotur img{width:100%;height:100%;display:block;object-fit:cover;pointer-events:none}
.bak{transform:rotateY(180deg)}
.sk,.gl{position:absolute;inset:0;pointer-events:none;opacity:0}
.sk{background:linear-gradient(90deg,rgba(20,17,30,.55),rgba(20,17,30,.25) 40%,rgba(20,17,30,.12))}
.bak .sk{background:linear-gradient(270deg,rgba(20,17,30,.55),rgba(20,17,30,.25) 40%,rgba(20,17,30,.12))}
.gl{background:linear-gradient(112deg,rgba(255,255,255,0) 20%,rgba(255,255,255,.9) 46%,rgba(255,255,255,.3) 54%,rgba(255,255,255,0) 72%);mix-blend-mode:screen}
.bak .gl{background:linear-gradient(248deg,rgba(255,255,255,0) 20%,rgba(255,255,255,.9) 46%,rgba(255,255,255,.3) 54%,rgba(255,255,255,0) 72%)}
.flotur::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(20,17,30,.22) 0%,rgba(20,17,30,.05) 6%,transparent 14%)}
.bak::after{background:linear-gradient(270deg,rgba(20,17,30,.22) 0%,rgba(20,17,30,.05) 6%,transparent 14%)}
/* laminated covers: slightly larger than the block, hard rim light, resting sheen */
.blad.kapa{width:calc(var(--p)*1.015);height:calc(var(--p)*1.03);top:calc(var(--p)*-.015)}
.blad.kapa .flotur{box-shadow:0 2px 6px rgba(20,17,30,.25),inset 0 0 0 1px rgba(255,255,255,.5)}
.blad.kapa .flotur.lam::after{background:linear-gradient(90deg,rgba(20,17,30,.10),transparent 10%),linear-gradient(118deg,rgba(255,255,255,0) 28%,rgba(255,255,255,.5) 42%,rgba(255,255,255,.16) 49%,rgba(255,255,255,0) 60%),linear-gradient(180deg,rgba(255,255,255,.06),rgba(20,17,30,.05))}
.blad.kapa .flotur.lam.bak::after{background:linear-gradient(270deg,rgba(20,17,30,.10),transparent 10%),linear-gradient(242deg,rgba(255,255,255,0) 28%,rgba(255,255,255,.5) 42%,rgba(255,255,255,.16) 49%,rgba(255,255,255,0) 60%),linear-gradient(180deg,rgba(255,255,255,.06),rgba(20,17,30,.05))}

.smellisvaedi{position:absolute;top:0;height:100%;width:50%;z-index:40;cursor:pointer}
#vinstriSm{left:0}#haegriSm{right:0}

.stjorn{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:14px}
.hnappur{height:44px;min-width:44px;padding:0 14px;border-radius:999px;border:none;cursor:pointer;background:var(--hnappur);color:var(--hnappur-blek);font:600 13px/1 var(--display);letter-spacing:.04em;
  box-shadow:0 2px 10px rgba(20,17,30,.18);transition:transform .15s,opacity .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.hnappur.hringur{width:44px;padding:0;font-size:18px}
.hnappur:hover{transform:translateY(-2px)}
.hnappur:focus-visible{outline:2px solid var(--blek);outline-offset:2px}
.hnappur[disabled]{opacity:.3;cursor:default;transform:none}
.teljari{font-size:13px;letter-spacing:.12em;color:var(--blek-mjukt);min-width:120px;text-align:center;font-variant-numeric:tabular-nums}
.visbending{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:12px;letter-spacing:.1em;color:var(--blek-mjukt);z-index:50;transition:opacity .6s;white-space:nowrap}
.visbending.falin{opacity:0}
@media (max-width:700px){
  :root{--p:min(46vw,56vh);--th:9px}
  .haus{left:16px}.stilling{right:16px}
  .haus .undir{display:none}
  .teljari{min-width:0;font-size:11px}
}
</style>

<div class="haus">
  <div class="merki">SVIF</div>
  <div class="undir">Velkomstbók — prufuflettu</div>
</div>
<div class="stilling">
  <div class="pilla" role="group" aria-label="Sýn">
    <button type="button" id="sjon2d" aria-pressed="false">2D</button>
    <button type="button" id="sjon3d" aria-pressed="true">3D</button>
  </div>
</div>

<div class="svid">
  <div class="halli">
    <div class="bok" id="bok">
      <div class="golfskuggi"></div>
      <div class="blokk v" id="blokkV"><div class="topp"></div><div class="kantur"></div><div class="botn"></div></div>
      <div class="blokk h" id="blokkH"><div class="topp"></div><div class="kantur"></div><div class="botn"></div></div>
      <div class="kast v" id="kastV"></div><div class="kast h" id="kastH"></div>
      <div class="smellisvaedi" id="vinstriSm" aria-hidden="true"></div>
      <div class="smellisvaedi" id="haegriSm" aria-hidden="true"></div>
    </div>
  </div>
</div>

<div class="visbending" id="visbending">Smelltu á bókina eða notaðu örvatakkana til að fletta</div>
<div class="stjorn">
  <button class="hnappur hringur" id="afturHn" type="button" aria-label="Fyrri opna">‹</button>
  <div class="teljari" id="teljari">Forsíða</div>
  <button class="hnappur hringur" id="framHn" type="button" aria-label="Næsta opna">›</button>
  <button class="hnappur" id="byrjaHn" type="button">Byrja aftur</button>
</div>

<script>
(function(){
  // 26 síður = 13 blöð. 0 forsíða, 1 yfirlit (innan á kápu), 2 afsláttarmiðar í 3D, 3–22 auglýsingar (bestu tilboðin fyrst),
  // 23 Um SVIF, 24 afsláttarmiðarnir sex til að klippa út (innan á bakkápu), 25 bakkápa.
  const heiti=['Forsíða','Yfirlit','Afsláttarmiðar','Parki','Íspan','Maus','Maus','Sticker','Litamálun','Kora','HK Lagnir','HTH','Ormsson','Gluggavinir','Múrbúðin','VÍS','Gardínur','Steindi','Steindi','Ísorka','Lásar.is','Heit gólf','MJ Lausnir','Um SVIF','Afsláttarmiðar','Bakkápa'];
  const S=heiti.length, N=S/2;
  const bok=document.getElementById('bok');
  const mynd=i=>`sidur/sida_${String(i).padStart(2,'0')}.jpg`;
  const blod=[];
  const fyrsta=document.getElementById('kastV');
  for(let i=0;i<N;i++){
    const kapa=(i===0||i===N-1);
    const el=document.createElement('div'); el.className='blad'+(kapa?' kapa':''); el.id='blad'+i;
    el.innerHTML=
      `<div class="flotur fram${i===0?' lam':''}"><img src="${mynd(2*i)}" alt="${heiti[2*i]}"><div class="sk"></div>${i===0?'<div class="gl"></div>':''}</div>`+
      `<div class="flotur bak${i===N-1?' lam':''}"><img src="${mynd(2*i+1)}" alt="${heiti[2*i+1]}"><div class="sk"></div>${i===N-1?'<div class="gl"></div>':''}</div>`;
    bok.insertBefore(el, fyrsta);
    blod.push({el,kapa,skf:el.querySelector('.fram .sk'),skb:el.querySelector('.bak .sk'),glf:el.querySelector('.fram .gl'),glb:el.querySelector('.bak .gl')});
  }
  const teljari=document.getElementById('teljari'), afturHn=document.getElementById('afturHn'), framHn=document.getElementById('framHn');
  const visbending=document.getElementById('visbending'), blokkV=document.getElementById('blokkV'), blokkH=document.getElementById('blokkH');
  const kastV=document.getElementById('kastV'), kastH=document.getElementById('kastH');
  let flett=0, hreyft=false, busy=false, anim=null;

  function setja(b, theta){
    // theta: 0 = liggur hægra megin, 180 = liggur vinstra megin
    b.el.style.transform=`rotateY(${-theta}deg)`;
    const tilt=Math.sin(theta*Math.PI/180);              // 1 = stendur lóðrétt
    const d=b.kapa?.5:.8;
    b.skf.style.opacity=tilt*d; b.skb.style.opacity=tilt*d;
    if(b.glf){ b.glf.style.opacity=Math.pow(Math.max(0,Math.cos((theta-34)*Math.PI/180)),9)*.9*(theta>2?1:0); }
    if(b.glb){ b.glb.style.opacity=Math.pow(Math.max(0,Math.cos((theta-146)*Math.PI/180)),9)*.9*(theta<178?1:0); }
  }
  function stada(){
    for(let i=0;i<N;i++){
      const b=blod[i], erFlett=i<flett;
      if(!b.busy) setja(b, erFlett?180:0);
      b.el.style.zIndex=erFlett?(i+1):(N-i);
    }
    let x='0';
    if(flett===0) x='calc(-1 * 25%)'; else if(flett===N) x='25%';
    bok.style.transform='translateX('+x+')';
    const th=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--th'))||14;
    const vs=flett-(anim==='fram'?1:0), hs=N-flett-(anim==='aftur'?1:0);
    const v=Math.max(0,vs-1), h=Math.max(0,hs-1);
    blokkV.style.setProperty('--th',(th*v/(N-1)+1)+'px'); blokkH.style.setProperty('--th',(th*h/(N-1)+1)+'px');
    blokkV.style.visibility=vs<=0?'hidden':'visible'; blokkH.style.visibility=hs<=0?'hidden':'visible';
    if(flett===0) teljari.textContent='Forsíða';
    else if(flett===N) teljari.textContent='Bakkápa';
    else teljari.textContent=heiti[2*flett-1]+' · '+heiti[2*flett];
    afturHn.disabled=flett===0; framHn.disabled=flett===N;
  }
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function fletta(b, fra, til, done){
    const dur=reduced?160:(b.kapa?1200:950), t0=performance.now();
    b.busy=true; b.el.style.zIndex=N+2;
    function rammi(now){
      const t=Math.min(1,(now-t0)/dur), e=ease(t);
      const theta=fra+(til-fra)*e;
      setja(b, theta);
      // skuggi á síðurnar undir: fellur á þá hlið sem blaðið hallar yfir
      const s=Math.sin(theta*Math.PI/180);
      kastH.style.opacity=(theta<90?s:0)*.8; kastV.style.opacity=(theta>=90?s:0)*.8;
      if(t<1) requestAnimationFrame(rammi); else { b.busy=false; setja(b,til); kastH.style.opacity=0; kastV.style.opacity=0; done(); }
    }
    requestAnimationFrame(rammi);
  }
  function snerti(){ if(!hreyft){hreyft=true;visbending.classList.add('falin');} }
  function fram(){ if(busy||flett>=N) return; busy=true; anim='fram'; snerti(); const b=blod[flett]; flett++; stada(); fletta(b,0,180,()=>{busy=false;anim=null;stada();}); }
  function aftur(){ if(busy||flett<=0) return; busy=true; anim='aftur'; snerti(); flett--; const b=blod[flett]; stada(); fletta(b,180,0,()=>{busy=false;anim=null;stada();}); }

  document.getElementById('haegriSm').addEventListener('click',fram);
  document.getElementById('vinstriSm').addEventListener('click',aftur);
  framHn.addEventListener('click',fram); afturHn.addEventListener('click',aftur);
  document.getElementById('byrjaHn').addEventListener('click',()=>{ if(busy)return; flett=0; stada(); });
  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();fram();}
    if(e.key==='ArrowLeft'){e.preventDefault();aftur();}
    if(e.key==='Home'){ if(!busy){flett=0;stada();} }
  });
  const b2=document.getElementById('sjon2d'), b3=document.getElementById('sjon3d');
  function sjon(flatt){ document.body.classList.toggle('flatt',flatt); b2.setAttribute('aria-pressed',String(flatt)); b3.setAttribute('aria-pressed',String(!flatt)); }
  b2.addEventListener('click',()=>sjon(true)); b3.addEventListener('click',()=>sjon(false));
  let x0=null;
  document.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;},{passive:true});
  document.addEventListener('touchend',e=>{ if(x0===null)return; const dx=e.changedTouches[0].clientX-x0; x0=null; if(dx<-40)fram(); else if(dx>40)aftur(); });
  stada();
})();
</script>
</body></html>
