<!doctype html>
<html lang="is"><head><meta charset="utf-8"><title>Svif scenes</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #222; }
  #scene { position: relative; width: 1600px; height: 1067px; overflow: hidden; background: #b9a58c; }
  .abs { position: absolute; }
  .fill { position: absolute; inset: 0; pointer-events: none; }

  /* surfaces */
  .oak { background: url(../src/wood.jpg) center/2400px auto; filter: saturate(.9) contrast(.9) brightness(1.02); }
  .walnut { background: url(../src/wood.jpg) center/2400px auto; filter: sepia(.4) saturate(1.15) brightness(.38) contrast(1.25); }
  .paper { background: #e4dccf; }
  .paper::before { content: ""; position: absolute; inset: 0; opacity: .55; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .9  0 0 0 0 .87  0 0 0 0 .82  0 0 0 .6 0'/></filter><rect width='400' height='400' filter='url(%23p)'/></svg>"); }

  /* a booklet seen from above: cover, a few page edges, contact + soft shadow */
  .bk { position: absolute; }
  .bk img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .bk .edge { position: absolute; inset: 0; background: #f1efe9;
    box-shadow: 0 1px 0 #e6e3dd, 0 2px 0 #f3f1ec, 0 3px 0 #e2dfd8, 0 4px 0 #efede7, 0 5px 0 #d9d5ce,
      1px 1px 0 #e6e3dd, 2px 3px 0 #e2dfd8, 3px 5px 0 #dedad3,
      0 8px 5px rgba(30,20,10,.32), 16px 30px 44px rgba(30,20,10,.34), 34px 66px 110px rgba(30,20,10,.2); }
  .bk .gloss { position: absolute; inset: 0; background:
      linear-gradient(118deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.08) 46%, rgba(255,255,255,0) 58%),
      linear-gradient(90deg, rgba(0,0,0,.16) 0, rgba(0,0,0,0) 2%, rgba(255,255,255,.05) 3%, rgba(255,255,255,0) 6%); }

  /* props (top-down only) */
  .mug { position: absolute; width: 190px; height: 190px; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #2a1a10 0 47%, #3b2516 50%, #5a3c26 52.5%, #ece7df 54.5%, #f7f4ef 62%, #e2dcd2 70%, #cfc8bc 71%);
    box-shadow: 22px 30px 30px rgba(30,20,10,.35), 46px 64px 80px rgba(30,20,10,.22), inset -6px -8px 14px rgba(0,0,0,.12); }
  .mug::before { content: ""; position: absolute; left: 42%; top: 40%; width: 24%; height: 12%; border-radius: 50%; background: rgba(255,240,220,.22); filter: blur(4px); }
  .mug::after { content: ""; position: absolute; right: -54px; top: 72px; width: 66px; height: 46px; border-radius: 0 24px 24px 0;
    border: 13px solid #ece7df; border-left: none; box-shadow: 14px 18px 18px rgba(30,20,10,.25); }
  .pebble { position: absolute; border-radius: 50%; background: radial-gradient(ellipse at 38% 34%, #d9d5ce, #a8a29a 62%, #8b857d);
    box-shadow: 14px 18px 18px rgba(30,20,10,.32), inset -6px -8px 12px rgba(0,0,0,.18); }
  .sprig { position: absolute; transform-origin: 0 50%; }

  /* window light: soft-light panes plus darker surround */
  .dark { mix-blend-mode: multiply; background: rgba(70,52,36,.38); }
  .panes { filter: blur(16px); mix-blend-mode: soft-light; }
  .panes i { position: absolute; background: rgba(255,236,205,.9); }
  .vig { background: radial-gradient(ellipse 78% 72% at 52% 55%, rgba(0,0,0,0) 55%, rgba(25,16,8,.34) 100%); }
  .grain { opacity: .12; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.4 -.2'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); }
  .dof { backdrop-filter: blur(6px); }

  /* 3D plane for angled shots */
  .plane { position: absolute; transform-style: preserve-3d; }
  .box { position: absolute; transform-style: preserve-3d; }
  .box .face { position: absolute; }
  .pages { background: repeating-linear-gradient(0deg, #f4f2ec 0 1px, #dcd7cf 1px 2px, #ece9e2 2px 3px); }
  .pages-v { background: repeating-linear-gradient(90deg, #f4f2ec 0 1px, #dcd7cf 1px 2px, #ece9e2 2px 3px); }
</style></head><body>
<div id="scene"></div>
<script>
const F = '../final/v4-svif-2026-front.jpg', B = '../final/v4-svif-2026-back.jpg';
const S = document.getElementById('scene');
const h = (html) => S.insertAdjacentHTML('beforeend', html);
const bk = (src, x, y, size, rot) => `<div class="bk" style="left:${x}px;top:${y}px;width:${size}px;height:${size}px;transform:rotate(${rot}deg)"><div class="edge"></div><img src="${src}"><div class="gloss"></div></div>`;
const light = (panes, dark = .38) => `<div class="fill" style="mix-blend-mode:multiply;filter:blur(20px)"><div class="fill" style="background:rgba(70,52,36,${dark});clip-path:polygon(${invert(panes)})"></div></div>
  <div class="fill" style="mix-blend-mode:soft-light;filter:blur(20px)">${panes.map(p => `<i class="abs" style="left:0;top:0;width:100%;height:100%;background:rgba(255,236,206,.42);clip-path:polygon(${p})"></i>`).join('')}</div>`;
// darken everything outside the light panes: draw the full frame, then cut the panes out (evenodd)
const invert = (panes) => '-20% -20%, 120% -20%, 120% 120%, -20% 120%';
const finish = (vig = true) => `${vig ? '<div class="fill vig"></div>' : ''}<div class="fill grain"></div>`;
// a stack of separate booklets, each 3 px thick and slightly misaligned
const stack = (src, x, y, size, n, rot, t = 3.4) => {
  let s = '';
  for (let i = 0; i < n; i++) {
    const top = i === n - 1;
    const jr = top ? 0 : Math.sin(i * 2.3) * 1.6, jx = top ? 0 : Math.sin(i * 1.7) * 7, jy = top ? 0 : Math.cos(i * 2.9) * 6;
    s += `<div class="box" style="left:${x + jx}px;top:${y + jy}px;width:${size}px;height:${size}px;transform:translateZ(${i * t}px) rotateZ(${rot + jr}deg)">
      <div class="face" style="left:0;top:0;width:${size}px;height:${size}px;transform:translateZ(${t}px);background:#efece6">${top ? `<img src="${src}" style="width:100%;height:100%;display:block"><div class="fill" style="background:linear-gradient(118deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.08) 46%,rgba(255,255,255,0) 58%)"></div>` : ''}</div>
      <div class="face pages" style="left:0;top:${size}px;width:${size}px;height:${t}px;transform-origin:top;transform:translateZ(${t}px) rotateX(-90deg);filter:brightness(${0.92 + (i % 3) * 0.03})"></div>
      <div class="face pages-v" style="left:${size}px;top:0;width:${t}px;height:${size}px;transform-origin:left;transform:translateZ(${t}px) rotateY(90deg);filter:brightness(.8)"></div>
    </div>`;
  }
  return s;
};
const shadow3d = (x, y, size, rot, blur = 40, op = .45) => `<div class="abs" style="left:${x}px;top:${y}px;width:${size}px;height:${size}px;transform:rotateZ(${rot}deg);box-shadow:0 0 6px 2px rgba(30,20,10,${op}),20px 30px ${blur}px rgba(30,20,10,${op*.8}),40px 70px ${blur*2.5}px rgba(30,20,10,${op*.45})"></div>`;

const scene = new URLSearchParams(location.search).get('s');
if (scene === 'ofanfra') {
  // top-down on oak, front and back, a mug of coffee, window light
  h(`<div class="fill oak"></div>`);
  h(bk(B, 860, 250, 560, 6));
  h(bk(F, 250, 180, 600, -5));
  h(`<div class="pebble" style="left:1300px;top:860px;width:110px;height:78px;transform:rotate(-20deg)"></div>`);
  h(`<div class="mug" style="left:1210px;top:70px"></div>`);
  h(light(['22% 0, 62% 0, 30% 100%, -10% 100%', '66% 0, 100% 0, 74% 100%, 34% 100%']));
  h(finish());
}
if (scene === 'bunki') {
  // a stack of booklets (the print run) at an angle, back cover beside it
  h(`<div class="fill oak" style="transform:scale(1.3)"></div>`);
  h(`<div class="plane" style="left:0;top:0;width:1600px;height:1067px;transform:perspective(2200px) rotateX(38deg)">
       ${shadow3d(380, 330, 560, -8, 50, .5)}
       ${stack(F, 380, 330, 560, 9, -8)}
       ${shadow3d(1040, 420, 470, 10, 30, .4)}
       ${stack(B, 1040, 420, 470, 1, 10)}
     </div>`);
  h(light(['0 0, 45% 0, 20% 100%, -20% 100%', '50% 0, 80% 0, 55% 100%, 25% 100%'], .3));
  h(`<div class="fill dof" style="-webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.5) 16%,transparent 32%)"></div>`);
  h(finish());
}
if (scene === 'naermynd') {
  // low-angle hero shot of the front cover, shallow depth of field
  h(`<div class="fill oak" style="transform:scale(1.6)"></div>`);
  h(`<div class="plane" style="left:0;top:0;width:1600px;height:1067px;transform:perspective(1500px) rotateX(52deg) translateY(-40px)">
       ${shadow3d(470, 250, 700, -14, 50, .5)}
       ${stack(F, 470, 250, 700, 2, -14)}
     </div>`);
  h(light(['10% 0, 55% 0, 35% 100%, -10% 100%'], .32));
  h(`<div class="fill dof" style="-webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.7) 14%,transparent 34%)"></div>`);
  h(`<div class="fill dof" style="backdrop-filter:blur(4px);-webkit-mask-image:linear-gradient(0deg,#000 0%,transparent 14%)"></div>`);
  h(finish());
}
if (scene === 'pappir') {
  // beige paper, two covers overlapping on the diagonal, hard window shadow (like the Torrance photo)
  h(`<div class="fill paper"></div>`);
  h(bk(F, 760, 150, 640, -32));
  h(bk(F, 300, 260, 640, -32));
  h(`<div class="fill" style="mix-blend-mode:multiply;filter:blur(7px);background:linear-gradient(128deg, rgba(90,70,50,.55) 0 18%, rgba(90,70,50,0) 26%)"></div>`);
  h(`<div class="fill" style="mix-blend-mode:multiply;filter:blur(5px);background:linear-gradient(128deg, transparent 0 46%, rgba(90,70,50,.32) 47.5%, rgba(90,70,50,.32) 50%, transparent 51.5%)"></div>`);
  h(finish(false));
}
if (scene === 'dokkt') {
  // moody: back on top of the front on a dark walnut table
  h(`<div class="fill walnut"></div>`);
  h(bk(F, 280, 230, 580, -9));
  h(bk(B, 760, 180, 600, 7));
  h(`<div class="mug" style="left:150px;top:760px;filter:brightness(.92)"></div>`);
  h(light(['30% 0, 70% 0, 50% 100%, 10% 100%'], .25));
  h(finish());
}
</script>
</body></html>
