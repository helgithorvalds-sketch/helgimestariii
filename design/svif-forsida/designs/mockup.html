<!doctype html>
<html lang="is"><head><meta charset="utf-8"><title>Svif mockup</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #333; }
  #scene { position: relative; width: 1600px; height: 1200px; overflow: hidden; background: #b9a58c; }
  .plane {
    position: absolute; left: -500px; top: -470px; width: 2600px; height: 2300px;
    transform-origin: 50% 60%;
    transform: perspective(2600px) rotateX(22deg) rotateZ(-4deg);
    background: url(../src/wood.jpg) center/2600px auto;
    filter: saturate(.9) contrast(.9) brightness(1.02);
  }
  .booklet { position: absolute; width: 610px; height: 610px; }
  .booklet img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .booklet .edge {
    position: absolute; inset: 0; background: #f1efe9;
    box-shadow:
      0 1px 0 #e6e3dd, 0 2px 0 #f3f1ec, 0 3px 0 #e2dfd8, 0 4px 0 #efede7,
      0 5px 0 #dedad3, 0 6px 0 #ebe8e2, 0 7px 0 #d6d2ca,
      1px 1px 0 #e6e3dd, 2px 3px 0 #e2dfd8, 3px 5px 0 #dedad3,
      0 10px 6px rgba(35,22,10,.35),
      14px 34px 46px rgba(35,22,10,.38),
      30px 70px 110px rgba(35,22,10,.22);
  }
  .booklet .gloss { position: absolute; inset: 0; background: linear-gradient(118deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.10) 46%, rgba(255,255,255,0) 58%), linear-gradient(90deg, rgba(0,0,0,.18) 0, rgba(0,0,0,0) 2.2%, rgba(255,255,255,.06) 3%, rgba(255,255,255,0) 6%); }
  .b-back  { left: 1345px; top: 735px; transform: rotate(7deg); }
  .b-front { left: 690px; top: 715px; transform: rotate(-5deg); }

  /* window light falling across the table, like reference 1 */
  .light { position: absolute; inset: 0; pointer-events: none; }
  .shade { mix-blend-mode: multiply; background:
      linear-gradient(112deg, rgba(70,52,36,.48) 0%, rgba(70,52,36,.36) 18%, rgba(255,255,255,0) 30%, rgba(255,255,255,0) 66%, rgba(70,52,36,.42) 80%, rgba(70,52,36,.62) 100%);
    filter: blur(18px); }
  .mullion { mix-blend-mode: multiply; filter: blur(9px);
    background: linear-gradient(112deg, transparent 47.2%, rgba(80,60,40,.45) 48%, rgba(80,60,40,.45) 49.2%, transparent 50%); }
  .warm { mix-blend-mode: soft-light; background: linear-gradient(112deg, transparent 28%, rgba(255,226,180,.55) 40%, rgba(255,226,180,.45) 60%, transparent 70%); }
  .dof { backdrop-filter: blur(5px); -webkit-mask-image: linear-gradient(180deg, #000 0%, rgba(0,0,0,.6) 18%, transparent 38%); mask-image: linear-gradient(180deg, #000 0%, rgba(0,0,0,.6) 18%, transparent 38%); }
  .vig { background: radial-gradient(ellipse 75% 70% at 52% 58%, rgba(0,0,0,0) 55%, rgba(30,20,10,.28) 100%); }
  .grain { opacity: .12; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.4 -.2'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); }
</style></head><body>
<div id="scene">
  <div class="plane">
    <div class="booklet b-back"><div class="edge"></div><img id="imgBack" alt=""><div class="gloss"></div></div>
    <div class="booklet b-front"><div class="edge"></div><img id="imgFront" alt=""><div class="gloss"></div></div>
  </div>
  <div class="light shade"></div>
  <div class="light warm"></div>
  <div class="light dof"></div>
  <div class="light vig"></div>
  <div class="light grain"></div>
</div>
<script>
  const d = new URLSearchParams(location.search).get('d');
  document.getElementById('imgFront').src = `../final/${d}-front.jpg`;
  document.getElementById('imgBack').src = `../final/${d}-back.jpg`;
</script>
</body></html>
