<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:2400px;height:1600px;overflow:hidden}
body{background:linear-gradient(180deg,#E6E5EF 0%,#E2DDDF 38%,#D6CBBC 100%)}
.svid{position:absolute;inset:0;perspective:3000px;perspective-origin:50% 0%}
.bord{position:absolute;left:-400px;top:200px;width:3200px;height:2200px;transform-style:preserve-3d;transform:rotateX(48deg);
  background:radial-gradient(ellipse at 50% 30%,#E9E4E6 0%,#DCD2C6 55%,#CDBFAE 100%)}
.hlutur{position:absolute;transform-style:preserve-3d}
.s{position:absolute;inset:0;background-size:cover;background-position:center}
.sk{position:absolute;inset:-10px;background:rgba(40,28,15,.5);filter:blur(26px);transform:translate(26px,34px)}
</style></head><body><div class="svid"><div class="bord">
 <!-- lokuð bók (forsíða) -->
 <div class="hlutur" style="left:640px;top:330px;width:760px;height:760px;transform:rotateZ(-9deg)">
   <div class="sk"></div>
   <div class="s" style="background:repeating-linear-gradient(90deg,#FBF8F3 0 2px,#D9CFC0 2px 4px);transform:translate(7px,7px)"></div>
   <div class="s" style="background-image:url(../flett/sidur/sida_00.jpg);box-shadow:0 0 0 1px rgba(0,0,0,.18)"></div>
   <div class="s" style="background:linear-gradient(118deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.16) 47%,rgba(255,255,255,0) 60%)"></div>
 </div>
 <!-- opin bók: Af hverju SVIF + afsláttarmiðar -->
 <div class="hlutur" style="left:1500px;top:420px;width:1240px;height:620px;transform:rotateZ(5deg)">
   <div class="sk"></div>
   <div class="s" style="background:#F4EFE7;transform:translate(0,7px);border-radius:2px"></div>
   <div style="position:absolute;left:0;top:0;width:620px;height:620px;background-image:url(../flett/sidur/sida_27.jpg);background-size:cover"></div>
   <div style="position:absolute;left:620px;top:0;width:620px;height:620px;background-image:url(../flett/sidur/sida_28.jpg);background-size:cover"></div>
   <div class="s" style="background:linear-gradient(90deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.32) 49.4%,rgba(255,255,255,.12) 50.4%,rgba(0,0,0,0) 58%)"></div>
 </div>
</div></div></body></html>
